<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1877F2">
<title>VerifiCrédito · Más Pisto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  /* Código de color por rol (dónde está la solicitud) */
  --r-asesor:#B98300; --r-asesor-bg:#FFF4C2; --r-analista:#1877F2; --r-analista-bg:#E3EEFF;
  --r-verificador:#7C3AED; --r-verificador-bg:#F0E8FF; --r-desembolso:#E4630B; --r-desembolso-bg:#FFEBD9;
  --r-finalizada:#1F9D57; --r-finalizada-bg:#E3F6EA; --r-cerrada:#D63B3B; --r-cerrada-bg:#FDE8E8;
  /* Línea gráfica Más Pisto: azul marca + amarillo acento + tinta azul */
  --bg:#F7FAFF; --card:#ffffff; --ink:#0A2A66; --ink2:#5B6B82; --muted:#8796AD; --line:#DCE6F5;
  --brand:#1877F2; --brand-dk:#0B5AD6; --brand2:#EAF3FF; --accent:#FFD400; --accent-ink:#0A2A66;
  --gray:#6b7280; --gray-bg:#eef0f2; --blue:#1d5fb8; --blue-bg:#e3eefc; --green:#17803d; --green-bg:#e2f5e8;
  --red:#b42318; --red-bg:#fde8e6; --amber:#9a6200; --amber-bg:#fdf2d8; --violet:#6a3fb5; --violet-bg:#efe8fb;
  --teal:#0e7c6b; --teal-bg:#ddf3ee; --s1:#1877F2; --s2:#eb6834;
  --shadow:0 1px 2px rgba(10,42,102,.06),0 4px 14px rgba(11,90,214,.06);
}
@media (prefers-color-scheme: dark){ :root{
  --r-asesor:#F2C94C; --r-asesor-bg:#3A3212; --r-analista:#6AAEFF; --r-analista-bg:#15294D;
  --r-verificador:#B79BFF; --r-verificador-bg:#2B1F4A; --r-desembolso:#FF9A52; --r-desembolso-bg:#3D2410;
  --r-finalizada:#5CD68C; --r-finalizada-bg:#143222; --r-cerrada:#FF8A8A; --r-cerrada-bg:#3D1717;
  --bg:#0B1426; --card:#13203A; --ink:#EAF3FF; --ink2:#A9B8D0; --muted:#7D8DA8; --line:#22324F;
  --brand:#4C9AFF; --brand-dk:#1877F2; --brand2:#16284A; --gray-bg:#2a2d2f; --blue-bg:#1b2a40; --green-bg:#17301f; --red-bg:#3a1d1a;
  --amber-bg:#3a2e12; --violet-bg:#2a2140; --teal-bg:#15312c; --gray:#a4abb3; --blue:#7fb0f0; --green:#6fd08f;
  --red:#f28b82; --amber:#f0c060; --violet:#b9a0f0; --teal:#5fd0bb; --s1:#4C9AFF; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.name,.kpi .v,.res .box .v,.login .logo,.col-h b{font-family:Poppins,Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#1877F2,#0B5AD6);color:#fff;padding:10px 16px 0}
header.top .row{display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px;line-height:1.05}
header.top h1 .plus{color:var(--accent)} header.top h1 small{display:block;font:600 10px/1.4 Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;opacity:.85}
header.top .who{font-size:12px;opacity:.9;text-align:right}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 10px;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;color:rgba(255,255,255,.78);padding:9px 10px 11px;border-bottom:3px solid transparent;font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs button.on{color:#fff;border-color:var(--accent)}
nav.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:rgba(255,255,255,.22);font-size:11px;line-height:18px;text-align:center}
main{padding:12px 16px 110px;max-width:900px;margin:0 auto}
main.wide{max-width:1400px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.sol{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.sol:active{transform:scale(.995)}
.sol .main{flex:1;min-width:0}
.sol .name{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sol .sub{font-size:12.5px;color:var(--ink2);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.sol .right{text-align:right;flex:none}
.sol .amt{font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-gray{color:var(--gray);background:var(--gray-bg)} .c-blue{color:var(--blue);background:var(--blue-bg)}
.c-green{color:var(--green);background:var(--green-bg)} .c-red{color:var(--red);background:var(--red-bg)}
.c-amber{color:var(--amber);background:var(--amber-bg)} .c-violet{color:var(--violet);background:var(--violet-bg)}
.c-teal{color:var(--teal);background:var(--teal-bg)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--gray-bg);color:var(--ink)}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:active{background:var(--brand-dk)}
.btn.ok{background:var(--green);color:#fff} .btn.bad{background:var(--red);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1;min-width:120px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:15;background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.seg{display:flex;background:var(--gray-bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.filters button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* Modal / hoja */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 12px}
.sheet .bar h2{flex:1;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .body{padding:12px 16px 60px;max-width:760px;margin:0 auto}
.back{background:none;border:0;font-size:22px;padding:2px 8px;color:var(--ink)}
.dlg-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:600px){.dlg-wrap{align-items:center}.dlg{border-radius:18px}}
.dlg h3{margin:0 0 6px}
h4.sec{margin:18px 0 8px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:550;word-break:break-word}
.alert{border-radius:10px;padding:9px 12px;font-size:13.5px;margin:8px 0}
.alert.warn{background:var(--amber-bg);color:var(--amber)} .alert.err{background:var(--red-bg);color:var(--red)}
.alert.info{background:var(--blue-bg);color:var(--blue)} .alert.ok{background:var(--green-bg);color:var(--green)}

/* Ingresos */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 6px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.addrow{display:grid;grid-template-columns:1.2fr 1fr auto auto;gap:6px;margin-top:8px}
@media (max-width:420px){.addrow{grid-template-columns:1fr 1fr}.addrow .seg{grid-column:1/-1}}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.res .box{background:var(--brand2);border-radius:12px;padding:10px 12px}
.res .box .l{font-size:11.5px;color:var(--ink2);font-weight:600}
.res .box .v{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
.res .box.full{grid-column:1/-1}
.x{background:none;border:0;color:var(--muted);font-size:18px;padding:0 6px}

/* Comentarios estilo Facebook */
.cm{display:flex;gap:8px;margin:10px 0}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.av.sm{width:26px;height:26px;font-size:11px}
.cm-b{min-width:0;flex:1}
.bubble{display:inline-block;background:var(--gray-bg);border-radius:16px;padding:7px 12px;max-width:100%}
.bubble .au{font-weight:700;font-size:13.5px}
.bubble .rl{font-size:11px;color:var(--muted);font-weight:600;margin-left:4px}
.bubble .tx{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.cm-meta{font-size:12px;color:var(--ink2);padding:3px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cm-meta button{background:none;border:0;padding:0;font-weight:700;color:var(--ink2);font-size:12px}
.cm-meta button.liked{color:var(--s1)}
.likes{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11.5px}
.replies{margin-left:6px}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.composer textarea{border-radius:18px;padding:9px 14px;resize:none;min-height:40px;max-height:140px;background:var(--gray-bg);border-color:transparent}
.send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:17px}

/* Timeline */
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;margin-bottom:10px;font-size:13.5px}
.tl .ev:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.tl .ev small{color:var(--muted)}

/* Verificación */
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.item.done{border-color:var(--green)}
.item .hd{display:flex;align-items:center;gap:10px;font-weight:650}
.item .hd input{width:22px;height:22px;flex:none}
.thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--card);font-weight:550}
.chk input{width:20px;height:20px;flex:none}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.hbar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar .tr{background:var(--gray-bg);border-radius:4px;height:14px;overflow:hidden}
.hbar .fl{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pipe .st{flex:1;min-width:92px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.pipe .st b{display:block;font-size:20px}
/* Tablero kanban */
.bd-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bd-top .day{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:17px;flex:1;min-width:150px}
.bd-top .day::first-letter{text-transform:uppercase}
.bd-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:640px){.bd-sum{grid-template-columns:repeat(2,1fr)}}
.bd-sum .kpi{padding:9px 12px} .bd-sum .kpi .v{font-size:20px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:980px){.board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
  .board .col{flex:0 0 84vw;max-width:360px;scroll-snap-align:start}}
.col{background:var(--brand2);border-radius:16px;padding:8px;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 6px 10px;border-bottom:3px solid var(--cc);margin-bottom:8px}
.col-h b{font-size:14.5px;flex:1}
.col-h .cnt{background:var(--card);border-radius:999px;padding:1px 9px;font-weight:700;font-size:13px}
.col-body{display:flex;flex-direction:column;gap:8px;max-height:calc(100dvh - 300px);overflow-y:auto}
@media (max-width:980px){.col-body{max-height:none}}
.kc{background:var(--card);border-radius:12px;padding:10px 11px;box-shadow:var(--shadow);border:1px solid var(--line);border-left:4px solid var(--kc,var(--line));cursor:pointer}
.kc .nm{font-weight:650;font-size:14.5px;line-height:1.25}
.kc .ln{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--ink2);margin-top:5px}
.kc .tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tm span{font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:7px;background:var(--gray-bg);color:var(--ink2);font-variant-numeric:tabular-nums}
.tm .warn{background:var(--amber-bg);color:var(--amber)} .tm .late{background:var(--red-bg);color:var(--red)} .tm .good{background:var(--green-bg);color:var(--green)}
.col .empty{padding:18px 6px;font-size:13px}
/* Línea de tiempos */
.steps{position:relative}
.stp{display:grid;grid-template-columns:18px 1fr auto;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.stp:last-child{border-bottom:0}
.stp i{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--brand)}
.stp .d{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stp .d small{display:block;font-weight:500;color:var(--muted)}
.stp.now i{background:var(--accent);box-shadow:0 0 0 3px rgba(255,212,0,.35)}
.rol{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;background:var(--rb);color:var(--rc);white-space:nowrap}
.rol:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rc)}
.kc{border-left-color:var(--rc)!important} .kc .rolbar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.sol{border-left:5px solid var(--rc,var(--line))}
.leyenda{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pasos{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.pasos span{font-size:11px;font-weight:600;padding:2px 7px 2px 6px;border-radius:6px;background:var(--rb);color:var(--rc);border-left:3px solid var(--rc);font-variant-numeric:tabular-nums;white-space:nowrap}
.pasos span.cur{outline:1.5px dashed var(--rc);outline-offset:1px}
.pasos span.late{background:var(--red-bg);color:var(--red);border-left-color:var(--red)}
.stp i{background:var(--rc,var(--brand))!important}
.stp .pn{display:inline-block;font-size:11.5px;font-weight:700;color:var(--rc);margin-right:4px}
.dif-ok{color:var(--green);font-weight:700} .dif-w{color:var(--amber);font-weight:700} .dif-b{color:var(--red);font-weight:700}
.dict{border-radius:12px;padding:10px 12px;font-weight:700;margin-top:10px;text-align:center;font-family:Poppins,Inter,sans-serif}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.err{background:var(--red);color:#fff}
.login{max-width:380px;margin:9vh auto;padding:0 16px}
.login .logo{font-size:26px;font-weight:800;color:var(--brand);text-align:center;margin-bottom:4px}
.login p.s{text-align:center;color:var(--ink2);margin-top:0}
.banner{position:sticky;top:52px;z-index:3;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.spacer{flex:1}
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div id="vLogin" class="login hidden">
  <div class="logo">Más Pisto<span style="color:var(--accent)">+</span></div>
  <p class="s">VerifiCrédito · Gestión de solicitudes</p>
  <div class="card" id="loginCard">
    <form id="fLogin">
      <label class="f">Correo</label><input id="lEmail" type="email" autocomplete="username" required>
      <label class="f">Contraseña</label><input id="lPass" type="password" autocomplete="current-password" required>
      <div class="btns"><button class="btn pri" type="submit">Entrar</button></div>
    </form>
  </div>
  <div class="card hidden" id="bootCard">
    <div class="alert info">Primera vez: cree la cuenta del administrador.</div>
    <form id="fBoot">
      <label class="f">Nombre</label><input id="bNombre" required>
      <label class="f">Correo</label><input id="bEmail" type="email" required>
      <label class="f">Contraseña (mín. 6)</label><input id="bPass" type="password" minlength="6" required>
      <div class="btns"><button class="btn pri" type="submit">Crear administrador</button></div>
    </form>
  </div>
</div>

<!-- ===== App ===== -->
<div id="vApp" class="hidden">
  <header class="top">
    <div class="row">
      <h1>Más Pisto<span class="plus">+</span><small>VerifiCrédito</small></h1>
      <div class="who"><div id="whoName"></div><div id="whoRol"></div></div>

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fDT = d => d ? new Date(d).toLocaleString('es-HN', {timeZone:TZ, day:'2-digit', month:'short', hour:'numeric', minute:'2-digit'}) : '—';

function edad(fn){ if(!fn) return null; const b = new Date(fn), h = new Date(); let a = h.getFullYear()-b.getFullYear();
  if (h.getMonth()<b.getMonth() || (h.getMonth()===b.getMonth() && h.getDate()<b.getDate())) a--; return a; }
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast' + (err?' err':''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2800); }
function errMsg(e){ return (e?.message || e?.error_description || String(e)).replace(/^.*?ERROR:\s*/,''); }

// ================== Cálculo (réplica exacta del Excel "Análisis de ingresos") ==================
function calcular(ingresos, tipoPago, rubro){
  const P = S.params;
  const sal = ingresos.filter(i => i.categoria === 'salario').map(i => +i.monto);
  const com = ingresos.filter(i => i.categoria === 'comision').map(i => +i.monto);
  const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : 0;
  const factor = tipoPago === 'Quincenal' ? P.factor_quincenal : tipoPago === 'Semanal' ? P.factor_semanal : 1;
  const r = P.redondeo || 1000;
  const bruto = avg(sal) * factor + avg(com);
  const promedio = Math.sign(bruto) * Math.round(Math.abs(bruto) / r) * r;  // MROUND
  const techo = rubro ? P.techo_rubro_especial : P.techo_regular;
  let limite, motivo;
  if (promedio === 0){ limite = 0; motivo = 'Sin ingresos registrados.'; }
  else if (promedio < P.ingreso_minimo){ limite = null; motivo = 'Ingresos insuficientes.'; }
  else {
    limite = Math.min(techo, Math.floor(promedio * P.porcentaje_limite / 1000) * 1000);  // ROUNDDOWN(-3)
    motivo = promedio * P.porcentaje_limite > techo
      ? (rubro ? 'Política de límite máximo por rubro aplicada.' : 'Política de límite máximo aplicada.')
      : `Aplica límite regular de ${Math.round(P.porcentaje_limite*100)}%.`;
  }
  let aumento = null;
  if (promedio >= P.ingreso_minimo){
    if (rubro) aumento = 'NO ELEGIBLE';
    else { const d = new Date(hoyHN()+'T12:00'); d.setMonth(d.getMonth()+3); aumento = fDate(d); }
  }
  return { promedio, limite, motivo, tasaPref: promedio > P.umbral_tasa_preferencial, aumento,
    insuficiente: promedio > 0 && promedio < P.ingreso_minimo, nSal: sal.length, nCom: com.length, promPago: avg(sal), factor };
}

async function cargarParams(){

  S.paramsRows = data || [];

}
async function cargarSolicitudes(){
  const { data, error } = await sb.from('solicitudes').select('*').order('actualizado_en', { ascending:false }).limit(1000);
  if (error) return toast(errMsg(error), true);
  S.sols = data || [];

  const { data: evr } = await sb.from('eventos').select('solicitud_id,de_estado,duracion_seg,duracion_habil_seg,creado_en').gte('creado_en', desdeEv).order('creado_en');
  S.evs = {}; (evr || []).forEach(e => { if (e.de_estado) (S.evs[e.solicitud_id] = S.evs[e.solicitud_id] || []).push(e); });
  const { data: cs } = await sb.from('comentarios').select('solicitud_id');
  S.com = {}; (cs||[]).forEach(c => S.com[c.solicitud_id] = (S.com[c.solicitud_id]||0) + 1);

// ================== Pestañas por rol ==================
const dias = (d, n) => d && (Date.now() - new Date(d)) < n*86400000;
const mio = s => !S.soloMias || s.asesor_id === S.me.id;
function tabsRol(){
  const T = {
    solicitudes:['solicitudes','Solicitudes', s => mio(s) && ['borrador','en_analisis'].includes(s.estado)],
    revisadas:['revisadas','Revisadas', s => mio(s) && (s.estado === 'aprobada' || (s.estado === 'denegada' && dias(s.dictamen_en, 15)))],
    proceso:['proceso','En proceso', s => mio(s) && (['por_verificar','desembolso_pendiente'].includes(s.estado) || (s.estado==='desembolsada' && dias(s.desembolsado_en, 7)))],
    analisis:['analisis','Análisis', s => s.estado === 'en_analisis'],
    verificar:['verificar','Por verificar', s => s.estado === 'por_verificar' && (!s.verificador_id || s.verificador_id === S.me.id || rol()==='admin')],
    verificadas:['verificadas','Mis verificaciones', s => s.verificado_en && s.verificador_id === S.me.id],
    desembolsos:['desembolsos','Desembolsos', s => s.estado === 'desembolso_pendiente' || (s.estado === 'desembolsada' && dias(s.desembolsado_en, 7))],
    todas:['todas','Todas', s => true],
    tablero:['tablero','Tablero', s => false],
    stats:['stats','Estadísticas'], usuarios:['usuarios','Usuarios'], params:['params','Parámetros']
  };
  const m = { asesor:['tablero','solicitudes','revisadas','proceso','todas','stats'],
    analista:['tablero','analisis','desembolsos','todas','stats'],
    verificador:['verificar','tablero','verificadas','stats'],
    admin:['tablero','solicitudes','revisadas','analisis','verificar','desembolsos','todas','stats','usuarios','params'] };
  return m[rol()].map(k => T[k]);
}
function pintarTabs(){
  $('#tabs').innerHTML = tabsRol().map(([k, t, f]) => {
    let n = '';
    if (f && k !== 'todas' && k !== 'verificadas'){
      const c = S.sols.filter(f).filter(s => k !== 'desembolsos' || s.estado === 'desembolso_pendiente').filter(s => k !== 'proceso' || s.estado !== 'desembolsada').length;
      if (c) n = `<span class="n">${c}</span>`;
    }
    return `<button data-k="${k}" class="${S.tab===k?'on':''}">${t}${n}</button>`;
  }).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.k; S.q=''; pintarTabs(); pintar(); window.scrollTo(0,0); });
  $('#fab').classList.toggle('hidden', !(es('asesor') && ['tablero','solicitudes','revisadas','proceso'].includes(S.tab)));
}

// ================== Listas ==================
function pintar(){
  const tab = tabsRol().find(t => t[0] === S.tab);
  $('#main').classList.toggle('wide', S.tab === 'tablero');
  if (S.tab === 'tablero') return pintarTablero();
  if (S.tab === 'stats') return pintarStats();
  if (S.tab === 'usuarios') return pintarUsuarios();
  if (S.tab === 'params') return pintarParams();
  let lista = S.sols.filter(tab[2]);
  let extra = '';
  if (S.tab === 'todas'){
    const fs = [['abiertas','Abiertas'],['todas','Todas'],...Object.entries(EST).map(([k,v]) => [k, v.t])];
    extra = `<div class="filters">${fs.map(([k,t]) => `<button data-f="${k}" class="${S.filtroTodas===k?'on':''}">${t}</button>`).join('')}</div>`;
    if (S.filtroTodas === 'abiertas') lista = lista.filter(s => !CERRADAS.includes(s.estado));
    else if (S.filtroTodas !== 'todas') lista = lista.filter(s => s.estado === S.filtroTodas);
  }
  if (S.tab === 'revisadas'){
    const ap = lista.filter(s => s.estado === 'aprobada').length, dn = lista.length - ap;
    extra = `<div class="alert info small">${ap} aprobada(s) por completar con el cliente · ${dn} denegada(s) en los últimos 15 días</div>`;
  }
  const q = S.q.trim().toLowerCase();
  if (q) lista = lista.filter(s => [s.nombre_cliente, s.codigo, s.dni, s.telefono].some(v => (v||'').toLowerCase().includes(q)));
  // Orden: lo más antiguo esperando primero en colas de trabajo
  if (['analisis','verificar'].includes(S.tab)) lista.sort((a,b) => new Date(a.actualizado_en) - new Date(b.actualizado_en));
  $('#main').innerHTML = `
    <div class="search"><input id="q" placeholder="Buscar por nombre, código, DNI o teléfono" value="${esc(S.q)}">
      ${['solicitudes','revisadas','proceso'].includes(S.tab) ? `<div class="seg" style="flex:none;min-width:160px"><button data-sm="0" class="${S.soloMias?'':'on'}">Todas</button><button data-sm="1" class="${S.soloMias?'on':''}">Solo mías</button></div>` : ''}</div>
    ${extra}
    ${lista.length ? lista.map(cardSol).join('') : `<div class="empty">No hay solicitudes aquí.</div>`}`;
  const qi = $('#q'); qi.oninput = () => { S.q = qi.value; const p = qi.selectionStart; pintar(); const n = $('#q'); n.focus(); n.setSelectionRange(p,p); };
  $('#main').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filtroTodas = b.dataset.f; pintar(); });
  $('#main').querySelectorAll('[data-sm]').forEach(b => b.onclick = () => { S.soloMias = b.dataset.sm === '1'; pintarTabs(); pintar(); });
  $('#main').querySelectorAll('.sol').forEach(c => c.onclick = () => abrirDetalle(+c.dataset.id));
}
function cardSol(s){
  const monto = s.monto_aprobado ? L(s.monto_solicitado || s.monto_aprobado) : '';
  const c = S.com[s.id] ? `<span>💬 ${S.com[s.id]}</span>` : '';
  const fecha = s.estado === 'en_analisis' ? `En cola ${hace(s.enviado_analisis_en)}` : hace(s.actualizado_en);
  let extra = '';
  if (s.estado === 'desembolso_pendiente' || s.forma_desembolso) extra = `<span>${s.forma_desembolso === 'transferencia' ? '🏦 Transferencia' : s.forma_desembolso === 'efectivo' ? '💵 Efectivo' : ''}</span>`;
  return `<div class="card sol" data-id="${s.id}" style="${rcVars(rolDe(s.estado))}">
    <div class="main">
      <div style="margin-bottom:4px">${rolPill(s)}</div>
      <div class="name">${esc(s.nombre_cliente)}</div>
      <div class="sub"><span>${esc(s.codigo)}</span>${tipoChip(s.tipo)}<span>👤 ${esc(nombre(s.asesor_id))}</span>${extra}${c}</div>
    </div>
    <div class="right">${chip(s.estado)}<div class="amt" style="margin-top:6px">${monto}</div><div class="small muted">${fecha}</div></div>
  </div>`;
}

}
let popIgnore = 0;
function histBack(){ return new Promise(r => { popIgnore++; const h = () => { window.removeEventListener('popstate', h); r(); }; window.addEventListener('popstate', h); history.back(); setTimeout(r, 400); }); }
function cerrarDialogo(w, fromPop){ if (!w.isConnected) return Promise.resolve(); w.remove(); S.dlgs = (S.dlgs||[]).filter(x => x !== w); return fromPop ? Promise.resolve() : histBack(); }
function pedirTexto(titulo, placeholder, okTxt, cls='pri'){
  return new Promise(res => {
    const w = dialogo(`<h3>${esc(titulo)}</h3><textarea id="ptT" rows="3" placeholder="${esc(placeholder)}"></textarea>
      <div class="btns"><button class="btn ghost" data-close>Cancelar</button><button class="btn ${cls}" id="ptOk">${esc(okTxt)}</button></div>`);
    w.querySelector('#ptT').focus();
    w.querySelector('#ptOk').onclick = () => { const v = w.querySelector('#ptT').value.trim(); if (!v) return toast('Escriba el motivo', true); cerrarDialogo(w); res(v); };
    const obs = new MutationObserver(() => { if (!w.isConnected){ obs.disconnect(); res(null); } }); obs.observe(document.body, { childList:true });
  });
}

// ================== Coincidencias ==================
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function coincidencias(s){
  const n = norm(s.nombre_cliente), tel = (s.telefono||'').replace(/\D/g,''), dni = (s.dni||'').replace(/\D/g,'');
  if (n.length < 5 && !tel && !dni) return '';
  const hits = S.sols.filter(o => o.id !== s.id).map(o => {
    const r = [];
    if (n.length >= 5 && norm(o.nombre_cliente) === n) r.push('mismo nombre');
    if (tel.length >= 8 && (o.telefono||'').replace(/\D/g,'') === tel) r.push('mismo teléfono');
    if (dni.length >= 8 && (o.dni||'').replace(/\D/g,'') === dni) r.push('mismo DNI');
    return r.length ? { o, r } : null;
  }).filter(Boolean);
  if (!hits.length) return '';
  return `<div class="alert warn small"><b>Coincidencias:</b><br>${hits.slice(0,6).map(h =>
    `${esc(h.o.codigo)} · ${esc(h.o.nombre_cliente)} · ${EST[h.o.estado].t} (${h.r.join(', ')})`).join('<br>')}</div>`;
}

// ================== Detalle ==================
async function abrirDetalle(id, keepScroll){
  const s = S.sols.find(x => x.id === id); if (!s) return;
  S.det = id; S.replyTo = null; S.dirty = false;
  if ($('#sheet').classList.contains('hidden')){ $('#sheet').classList.remove('hidden'); history.pushState({ sheet:1 }, ''); document.body.style.overflow = 'hidden'; }
  $('#sheetTitle').textContent = s.nombre_cliente; $('#sheetChip').innerHTML = chip(s.estado);
  if (!keepScroll){ $('#sheetBody').innerHTML = '<div class="empty">Cargando…</div>'; $('#sheet').scrollTop = 0; }
  const [ing, items, evs] = await Promise.all([
    sb.from('ingresos').select('*').eq('solicitud_id', id).order('fecha'),
    sb.from('verificacion_items').select('*').eq('solicitud_id', id).order('id'),
    sb.from('eventos').select('*').eq('solicitud_id', id).order('creado_en')
  ]);
  S.detData = { s, ing: ing.data||[], items: items.data||[], evs: evs.data||[] };
  const y = $('#sheet').scrollTop;
  renderDetalle();
  if (keepScroll) $('#sheet').scrollTop = y;
  cargarComentarios();
}
function cerrarDetalle(fromPop){
  if ($('#sheet').classList.contains('hidden')) return;
  if (S.dirty && !confirm('Hay datos sin enviar. ¿Salir de todos modos?')){ if (fromPop) history.pushState({ sheet:1 }, ''); return; }
  $('#sheet').classList.add('hidden'); document.body.style.overflow = ''; S.det = null; S.dirty = false;
  pintarTabs(); pintar();
  if (!fromPop) return histBack();
}
$('#sheetBack').onclick = () => cerrarDetalle();
window.addEventListener('popstate', () => {
  if (popIgnore > 0){ popIgnore--; return; }
  if (S.dlgs?.length) return cerrarDialogo(S.dlgs[S.dlgs.length-1], true);
  if (!$('#sheet').classList.contains('hidden')) cerrarDetalle(true);
});

function renderDetalle(){

  const c = calcular(ing, s.tipo_pago, s.rubro_especial);
  const d = s.datos_cliente || {};
  const ed = edad(d.fecha_nacimiento);
  let h = '';

  // Encabezado
  h += `<div class="card">
    <div class="row" style="flex-wrap:wrap;gap:6px">${tipoChip(s.tipo)} ${chip(s.estado)} <span class="spacer"></span><span class="small muted">${esc(s.codigo)}</span></div>
    <dl class="kv" style="margin-top:10px">
      <dt>Asesor</dt><dd>${rol() === 'admin' && !CERRADAS.includes(s.estado) ? `<select id="dAsesor" style="padding:4px 8px">${Object.values(S.perfiles).filter(p => p.activo && ['asesor','admin'].includes(p.rol)).map(p => `<option value="${p.id}" ${p.id === s.asesor_id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>` : esc(nombre(s.asesor_id))}</dd>
      ${s.telefono ? `<dt>Teléfono</dt><dd><a href="tel:${esc(s.telefono)}">${esc(s.telefono)}</a> · <a href="https://wa.me/504${esc(s.telefono.replace(/\D/g,'').slice(-8))}" target="_blank">WhatsApp</a></dd>` : ''}
      ${s.dni ? `<dt>DNI</dt><dd>${esc(s.dni)}</dd>` : ''}
      <dt>Creada</dt><dd>${fDT(s.creado_en)}</dd>
      ${s.analista_id ? `<dt>Analista</dt><dd>${esc(nombre(s.analista_id))}</dd>` : ''}
      ${s.verificador_id ? `<dt>Verificador</dt><dd>${esc(nombre(s.verificador_id))}</dd>` : ''}
    </dl>
    ${coincidencias(s)}
    ${ed != null && ed < S.params.edad_minima ? `<div class="alert err small">⚠ Cliente de ${ed} años (mínimo ${S.params.edad_minima}).</div>` : ''}
  </div>`;

  // Devuelta
  const ultDev = [...evs].reverse().find(e => e.accion === 'devuelta_asesor');
  if (s.estado === 'borrador' && ultDev) h += `<div class="alert warn"><b>Devuelta por ${esc(nombre(ultDev.usuario_id))}:</b> ${esc(ultDev.nota)}</div>`;

  // Dictamen mostrado
  if (s.dictamen_en){
    const libre = montoLibre(s);
    h += `<div class="card"><h4 class="sec" style="margin-top:0">Dictamen del analista</h4>
      <div class="alert ${s.estado==='denegada'?'err':'ok'}"><b>${s.estado==='denegada'?'DENEGADA':'APROBADA'}</b> por ${esc(nombre(s.analista_id))} · ${fDT(s.dictamen_en)}</div>
      <dl class="kv">
        ${s.monto_aprobado ? `<dt>Monto aprobado</dt><dd>${L(s.monto_aprobado)}</dd>` : ''}
        ${s.saldo_capital != null ? `<dt>Saldo capital</dt><dd>${L(s.saldo_capital)}</dd>` : ''}
        ${s.saldo_intereses != null ? `<dt>Saldo intereses</dt><dd>${L(s.saldo_intereses)}</dd>` : ''}
        ${libre != null && s.tipo !== 'nuevo' ? `<dt>Monto libre</dt><dd>${L(libre)}</dd>` : ''}
        ${s.tasa_preferencial ? `<dt>Tasa</dt><dd>Preferencial</dd>` : ''}
        ${s.dictamen_nota ? `<dt>Nota</dt><dd>${esc(s.dictamen_nota)}</dd>` : ''}
      </dl></div>`;
  }

  // Análisis de ingresos
  const mostrarIng = s.tipo === 'nuevo' || ing.length || editIng;
  if (mostrarIng){
    h += `<div class="card"><h4 class="sec" style="margin-top:0">Análisis de ingresos</h4>
      ${s.tipo !== 'nuevo' && !ing.length ? `<div class="small muted">Opcional en ${TIPO[s.tipo].toLowerCase()}.</div>` : ''}
      <div class="grid2">
        <div><label class="f">Tipo de pago</label>
          <select id="dPago" ${editIng?'':'disabled'}>${['Semanal','Quincenal','Mensual'].map(t => `<option ${s.tipo_pago===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label class="f">Rubro especial</label>
          <select id="dRubro" ${editIng?'':'disabled'}><option value="0">NO</option><option value="1" ${s.rubro_especial?'selected':''}>SÍ</option></select></div>
      </div>
      ${tablaIng('salario', 'Pagos de planilla', ing, editIng)}
      ${tablaIng('comision', 'Comisiones / bonos en otra fecha', ing, editIng)}
      ${editIng ? `<div class="addrow">
          <input type="date" id="iFecha" value="${hoyHN()}">
          <input id="iMonto" inputmode="decimal" placeholder="Monto L">
          <div class="seg" id="iCat"><button type="button" data-v="salario" class="on">Salario</button><button type="button" data-v="comision">Comisión</button></div>
          <button class="btn pri" id="iAdd">Agregar</button></div>` : ''}
      ${s.tipo !== 'nuevo' ? `<div class="res"><div class="box full"><div class="l">Promedio mensual</div><div class="v">${L(c.promedio)}</div>
        <div class="small muted">Promedio por pago ${L(c.promPago.toFixed(2))} × ${c.factor} ${c.nCom ? '+ promedio comisiones' : ''} → redondeado a ${S.params.redondeo}</div></div></div></div>` : `
      <div class="res">
        <div class="box"><div class="l">Promedio mensual</div><div class="v">${L(c.promedio)}</div></div>
        <div class="box" style="${c.insuficiente?'background:var(--red-bg)':''}"><div class="l">Límite aprobado</div><div class="v">${c.limite == null ? 'Insuficiente' : L(c.limite)}</div></div>
        <div class="box"><div class="l">Tasa preferencial</div><div class="v">${c.tasaPref?'SÍ':'NO'}</div></div>
        <div class="box"><div class="l">Próximo aumento</div><div class="v" style="font-size:15px">${c.aumento || 'N/A'}</div></div>
        <div class="box full"><div class="l">Techo aplicado</div><div style="font-weight:600">${c.motivo}</div>
          <div class="small muted">Promedio por pago ${L(c.promPago.toFixed(2))} × ${c.factor} ${c.nCom ? '+ promedio comisiones' : ''} → redondeado a ${S.params.redondeo}</div></div>
      </div></div>`}`;
  }
  // Análisis de refinanciamiento / reingreso (antigüedad, comportamiento de pago, cuotas)
  if (s.tipo !== 'nuevo') h += refiHTML(s, c, editIng);

  // Datos del cliente (completados)
  if (Object.keys(d).length || s.forma_desembolso) h += datosClienteHTML(s);

  // Acciones según estado y rol
  h += accionesHTML(s, c);

  // Verificación
  if (items.length) h += verificacionHTML(s, items);

  // Comentarios
  h += `<div class="card"><h4 class="sec" style="margin-top:0">Comentarios</h4><div id="cmList"><div class="muted small">Cargando…</div></div>
    <div class="composer">${av(S.me.id)}<textarea id="cmTxt" rows="1" placeholder="Escribe un comentario…"></textarea><button class="send" id="cmSend">➤</button></div></div>`;

  // Tiempos por paso + historial de gestiones
  h += tiemposHTML(s, evs);

  $('#sheetTitle').textContent = s.nombre_cliente; $('#sheetChip').innerHTML = chip(s.estado);
  $('#sheetBody').innerHTML = h;
  enlazarDetalle(s, c);
}
function montoLibre(s){
  const base = s.monto_solicitado || s.monto_aprobado;
  if (base == null) return null;
  return +base - (+s.saldo_capital||0) - (+s.saldo_intereses||0);
}
function tablaIng(cat, titulo, ing, edit){
  const rows = ing.filter(i => i.categoria === cat);
  if (!rows.length && !edit) return '';
  return `<label class="f" style="margin-top:14px">${titulo}</label>
    ${rows.length ? `<table class="t"><thead><tr><th>Fecha</th><th class="num">Monto</th><th></th></tr></thead><tbody>
    ${rows.map(i => `<tr><td>${fDate(i.fecha+'T12:00')}</td><td class="num">${L(i.monto)}</td><td style="width:30px">${edit?`<button class="x" data-del="${i.id}" title="Quitar">×</button>`:''}</td></tr>`).join('')}
    </tbody></table>` : `<div class="small muted">Sin registros.</div>`}`;
}

  const d = s.datos_cliente || {};
  const f = (k, t) => d[k] ? `<dt>${t}</dt><dd>${esc(d[k])}</dd>` : '';

  const ed = edad(d.fecha_nacimiento);
  return `<div class="card"><h4 class="sec" style="margin-top:0">Datos del cliente</h4><dl class="kv">
    ${f('dni','DNI')}${d.fecha_nacimiento ? `<dt>Nacimiento</dt><dd>${fDate(d.fecha_nacimiento+'T12:00')} (${ed} años)</dd>` : ''}

    ${f('empresa','Empresa')}${f('cargo','Cargo')}${f('direccion_trabajo','Dir. trabajo')}${f('antiguedad','Antigüedad')}${f('telefono_trabajo','Tel. trabajo')}

    ${f('notas','Notas')}
    </dl>
    ${refs.length ? `<label class="f">Referencias</label>${refs.map(r => `<div class="small">• ${esc(r.nombre)} (${esc(r.parentesco||'')}) ${r.telefono ? `<a href="tel:${esc(r.telefono)}">${esc(r.telefono)}</a>` : ''}</div>`).join('')}` : ''}
    ${s.desembolso_referencia ? `<div class="alert ok small">Desembolsada ${fDT(s.desembolsado_en)} · ${esc(s.desembolso_referencia)}</div>` : ''}

    ${s.motivo_cierre ? `<div class="alert warn small">Desistió: ${esc(s.motivo_cierre)}</div>` : ''}

}

function accionesHTML(s, c){
  let h = '';
  const abierta = !CERRADAS.includes(s.estado);
  // Asesor: borrador
  if (s.estado === 'borrador' && es('asesor')){
    h += `<div class="card"><div class="small muted">${s.tipo === 'nuevo' ? 'Agregue los pagos de planilla (y comisiones si aplica) y envíe a análisis.' : 'Lista para enviar a análisis.'}</div>
      <div class="btns"><button class="btn pri" id="aEnviar">Enviar a análisis</button></div></div>`;
  }
  // Analista: dictamen
  if (s.estado === 'en_analisis' && es('analista')){
    const refi = s.tipo !== 'nuevo';
    h += `<div class="card"><h4 class="sec" style="margin-top:0">Dictamen</h4>
      ${c.insuficiente ? `<div class="alert err small">Ingresos por debajo del mínimo (${L(S.params.ingreso_minimo)}).</div>` : ''}
      ${refi ? `<div id="dSug">${dictamenRefiHTML(calcRefi(s, c))}</div>` : ''}
      <label class="f">Monto aprobado</label><input id="dMonto" inputmode="decimal" value="${s.tipo==='nuevo' ? (c.limite || '') : (calcRefi(s, c).limAprob || '')}" placeholder="L">
      ${refi ? `<div class="alert info small" id="dLibre">Monto libre: —</div>` : ''}
      <label class="f">Nota / motivo</label><textarea id="dNota" rows="2" placeholder="Obligatorio si deniega o devuelve"></textarea>
      <div class="btns"><button class="btn ok" id="dAprobar">Aprobar</button><button class="btn bad" id="dDenegar">Denegar</button></div>
      <div class="btns" style="margin-top:6px"><button class="btn ghost sm" id="dDevolver">↩ Devolver al asesor para corregir</button></div></div>`;
  }
  // Asesor: completar (revisadas)
  if (s.estado === 'aprobada' && es('asesor')) h += completarHTML(s);
  // Desembolso por transferencia
  if (s.estado === 'desembolso_pendiente' && es('analista')){
    const libre = montoLibre(s);
    h += `<div class="card"><h4 class="sec" style="margin-top:0">Desembolso por transferencia</h4>
      <dl class="kv"><dt>Cuenta</dt><dd>${esc(s.cuenta_banco||'—')}</dd>
      <dt>Monto crédito</dt><dd>${L(s.monto_solicitado || s.monto_aprobado)}</dd>
      ${s.tipo !== 'nuevo' ? `<dt>A transferir (libre)</dt><dd><b>${L(libre)}</b></dd>` : ''}</dl>
      <label class="f">Referencia / N.º de transferencia</label><input id="tRef">
      <div class="btns"><button class="btn ok" id="tOk">Marcar como desembolsada</button></div>
      <div class="btns" style="margin-top:6px"><button class="btn ghost sm" id="tBack">↩ Regresar al asesor</button></div></div>`;
  }
  if (s.estado === 'por_verificar' && es('analista') && rol() !== 'verificador'){
    h += `<div class="btns"><button class="btn ghost sm" id="tBack">↩ Regresar a revisadas del asesor</button></div>`;
  }
  if (abierta && es('asesor','analista') && s.estado !== 'desembolso_pendiente')
    h += `<div class="btns"><button class="btn ghost sm" id="aDesistir" style="color:var(--red)">Cliente desistió / cerrar</button></div>`;
  return h;
}

function comprimir(file, max = 1280, q = 0.75){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => b ? res(b) : rej(new Error('No se pudo procesar la foto')), 'image/jpeg', q);
      URL.revokeObjectURL(img.src);
    }; img.onerror = () => rej(new Error('Imagen inválida')); img.src = URL.createObjectURL(file);
  });
}

  };

    F.querySelectorAll('#cForma button').forEach(x => x.classList.toggle('on', x===b)); $('#cCtaF').classList.toggle('hidden', forma !== 'transferencia'); destino(); });

    if (nuevo){
      const e2 = edad(datos.fecha_nacimiento);
      if (!datos.fecha_nacimiento) throw new Error('Ingrese la fecha de nacimiento');
      if (e2 < S.params.edad_minima) throw new Error(`El cliente tiene ${e2} años (mínimo ${S.params.edad_minima})`);
      if (datos.referencias.filter(r => r.nombre && r.telefono).length < 2) throw new Error('Ingrese 2 referencias familiares con teléfono');
    }
    const r = await rpc('completar_solicitud', { p_id: s.id, p_datos: datos, p_forma: forma,
      p_act_domicilio: !nuevo && $('#cDom').checked, p_act_trabajo: !nuevo && $('#cTrab').checked, p_act_foto: !nuevo && $('#cFoto').checked,

// ================== Análisis de refinanciamiento / reingreso (réplica del Excel) ==================
const mround = (x, m) => Math.sign(x) * Math.round(Math.abs(x) / m) * m;
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
function parseFecha(t){
  t = String(t || '').trim(); let m;
  const ok = (y, mo, d) => { y = +y; mo = +mo; d = +d; if (y < 100) y += 2000; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null; return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`; };
  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return ok(m[1], m[2], m[3]);
  if ((m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(\s|$)/))) return ok(m[3], m[2], m[1]);   // dd/mm/aaaa
  return null;
}
function parsePagos(txt){
  const out = [];
  txt.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const cells = line.includes('\t') ? line.split('\t') : line.trim().split(/\s{2,}|;/);
    const fechas = cells.map((c, i) => [parseFecha(c), i]).filter(x => x[0]);
    if (!fechas.length) return;                                   // encabezados / líneas sin fecha
    const iPago = fechas[0][1];
    const doc = cells.find(c => /[A-Za-z]{1,5}-?\d{3,}/.test(c)) || '';
    const valorCell = cells.slice(iPago + 1).find(c => /^\s*L?\s*-?[\d,]+(\.\d+)?\s*$/.test(c) && !parseFecha(c));
    const valor = valorCell ? +valorCell.replace(/[L,\s]/g, '') : null;

function fmtDur(sec){
  if (sec == null || isNaN(sec)) return '—';
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return '<1 min';
  const m = Math.floor(sec / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (h < 1) return `${m} min`;
  if (d < 1) return `${h} h ${String(m % 60).padStart(2,'0')} min`;
  return `${d} d ${h % 24} h`;
}
// Segundos hábiles (misma regla que la BD: L-V 8:30–16:30, sáb 8:30–12:00, sin domingos ni feriados). Honduras = UTC-6 fijo.
function segHabiles(t0, t1){
  const P = S.params, off = 6 * 3600e3;
  const a = new Date(t0).getTime() - off, b = new Date(t1).getTime() - off;
  if (!(b > a)) return 0;
  const hi = (P.hora_inicio ?? 8.5) * 3600e3, hlv = (P.hora_cierre_lv ?? 16.5) * 3600e3, hs = (P.hora_cierre_sab ?? 12) * 3600e3;
  let tot = 0, da = new Date(a), d = Date.UTC(da.getUTCFullYear(), da.getUTCMonth(), da.getUTCDate());
  for (; d <= b; d += 864e5){
    const dt = new Date(d), dow = dt.getUTCDay();
    if (dow === 0 || S.feriados.has(dt.toISOString().slice(0,10))) continue;
    const ini = Math.max(d + hi, a), fin = Math.min(d + (dow === 6 ? hs : hlv), b);
    if (fin > ini) tot += fin - ini;
  }
  return Math.round(tot / 1000);
}

  { k:'curso', t:'En curso',                est:['aprobada','por_verificar','desembolso_pendiente'], c:'var(--accent)' },
  { k:'fin',   t:'Finalizadas',             est:['desembolsada'], c:'var(--green)' },
  { k:'cerr',  t:'Canceladas / Rechazadas', est:['denegada','rechazada_verificacion','desistida'], c:'var(--red)' }
];
const diaHN = d => d ? new Date(d).toLocaleDateString('en-CA', { timeZone: TZ }) : null;
function pintarTablero(){
  const hoy = hoyHN(); if (!S.boardDay) S.boardDay = hoy;
  const dia = S.boardDay, esHoy = dia === hoy;
  const base = S.sols.filter(s => S.boardTodos ? true : s.asesor_id === S.me.id);
  const q = S.q.trim().toLowerCase();
  const match = s => !q || [s.nombre_cliente, s.codigo, s.dni, s.telefono].some(v => (v||'').toLowerCase().includes(q));
  const abiertas = s => !CERRADAS.includes(s.estado);
  const enCol = c => base.filter(match).filter(s => c.est.includes(s.estado)).filter(s =>
    abiertas(s) ? (esHoy ? diaHN(s.creado_en) <= dia : diaHN(s.creado_en) === dia) : diaHN(s.cerrado_en || s.actualizado_en) === dia)
    .sort((a,b) => abiertas(a) ? new Date(a.estado_desde || a.actualizado_en) - new Date(b.estado_desde || b.actualizado_en)
                                : new Date(b.cerrado_en || b.actualizado_en) - new Date(a.cerrado_en || a.actualizado_en));
  const creadasDia = base.filter(s => diaHN(s.creado_en) === dia);
  const desDia = base.filter(s => s.estado === 'desembolsada' && diaHN(s.cerrado_en || s.desembolsado_en) === dia);
  const cicloProm = desDia.length ? desDia.reduce((a,s) => a + (s.duracion_total_habil_seg ?? segHabiles(s.creado_en, s.desembolsado_en)), 0) / desDia.length : null;
  const monto = desDia.reduce((a,s) => a + +(s.monto_solicitado || s.monto_aprobado || 0), 0);
  const fechaTxt = new Date(dia + 'T12:00').toLocaleDateString('es-HN', { weekday:'long', day:'numeric', month:'long' });
  $('#main').innerHTML = `
    <div class="bd-top">
      <button class="btn sm ghost" data-dd="-1">‹</button>
      <div class="day">${esHoy ? 'Hoy · ' : ''}${fechaTxt}</div>
      <button class="btn sm ghost" data-dd="1" ${esHoy?'disabled':''}>›</button>
      ${esHoy ? '' : '<button class="btn sm pri" data-dd="0">Hoy</button>'}
      ${es('asesor') ? `<div class="seg" style="min-width:170px"><button data-bt="1" class="${S.boardTodos?'on':''}">Todas</button><button data-bt="0" class="${S.boardTodos?'':'on'}">Solo mías</button></div>` : ''}
    </div>
    <div class="search"><input id="q" placeholder="Buscar en el tablero" value="${esc(S.q)}"></div>
    <div class="bd-sum">
      <div class="kpi"><div class="l">Nuevas del día</div><div class="v">${creadasDia.length}</div></div>
      <div class="kpi"><div class="l">Desembolsadas</div><div class="v">${desDia.length}</div><div class="s">${L(monto)}</div></div>
      <div class="kpi"><div class="l">Ciclo promedio (hábil)</div><div class="v">${fmtDur(cicloProm)}</div><div class="s">meta ${fmtDur((S.params.meta_total_min||0)*60)}</div></div>
      <div class="kpi"><div class="l">En proceso ahora</div><div class="v">${base.filter(abiertas).length}</div><div class="s">${base.filter(s => abiertas(s) && diaHN(s.creado_en) < hoy).length} de días anteriores</div></div>
    </div>
    ${leyendaHTML()}
    <div class="board">${COLS.map(c => { const l = enCol(c); return `
      <section class="col"><div class="col-h" style="--cc:${c.c}"><b>${c.t}</b><span class="cnt">${l.length}</span></div>
      <div class="col-body">${l.length ? l.map(s => cardK(s, dia)).join('') : '<div class="empty">Sin solicitudes</div>'}</div></section>`; }).join('')}
    </div>`;
  $('#main').querySelectorAll('[data-dd]').forEach(b => b.onclick = () => {
    const n = +b.dataset.dd; if (!n){ S.boardDay = hoy; } else { const d = new Date(S.boardDay + 'T12:00'); d.setDate(d.getDate() + n); S.boardDay = d.toLocaleDateString('en-CA'); }
    pintarTablero(); });
  $('#main').querySelectorAll('[data-bt]').forEach(b => b.onclick = () => { S.boardTodos = b.dataset.bt === '1'; pintarTablero(); });
  const qi = $('#q'); qi.oninput = () => { S.q = qi.value; const p = qi.selectionStart; pintarTablero(); const n = $('#q'); n.focus(); n.setSelectionRange(p,p); };
  $('#main').querySelectorAll('.kc').forEach(c => c.onclick = () => abrirDetalle(+c.dataset.id));
}
function cardK(s, dia){
  const ab = !CERRADAS.includes(s.estado), ahora = new Date();
  const desde = s.estado_desde || s.actualizado_en;
  const monto = s.monto_aprobado ? L(s.monto_solicitado || s.monto_aprobado) : '';
  const colorEst = { gray:'var(--gray)', blue:'var(--blue)', green:'var(--green)', red:'var(--red)', amber:'var(--amber)', violet:'var(--violet)', teal:'var(--teal)' }[EST[s.estado].c];
  let tm = '';
  if (ab){
    const pHab = segHabiles(desde, ahora), tHab = segHabiles(s.creado_en, ahora);
    tm = `<span class="${clsMeta(pHab, S.params.meta_paso_min)}" data-live-paso="${desde}" title="Tiempo hábil en este paso">⏱ ${fmtDur(pHab)}</span>
          <span class="${clsMeta(tHab, S.params.meta_total_min)}" data-live-tot="${s.creado_en}" title="Tiempo hábil total desde que se creó">Σ ${fmtDur(tHab)}</span>`;
  } else {
    const t = s.duracion_total_habil_seg;
    tm = `<span class="${s.estado === 'desembolsada' ? (t != null && t <= (S.params.meta_total_min||0)*60 ? 'good' : 'warn') : ''}" title="Tiempo hábil total">Σ ${fmtDur(t)}</span><span>${fDT(s.cerrado_en || s.actualizado_en).split(',').pop().trim()}</span>`;
  }
  const previo = ab && diaHN(s.creado_en) < dia ? `<span class="chip c-gray">desde ${fDate(s.creado_en).replace(/ de \d{4}$/,'')}</span>` : '';
  return `<div class="kc" data-id="${s.id}" style="${rcVars(rolDe(s.estado))}">
    <div class="rolbar">${rolPill(s)}${previo}</div>
    <div class="nm">${esc(s.nombre_cliente)}</div>
    <div class="ln">${chip(s.estado)}${tipoChip(s.tipo)}</div>
    <div class="ln"><span>${esc(s.codigo)}</span><span>👤 ${esc(nombre(s.asesor_id).split(' ')[0])}</span>${ab ? `<span>Espera: <b>${ESPERA[s.estado]}</b></span>` : ''}${monto ? `<b style="color:var(--ink)">${monto}</b>` : ''}${S.com[s.id] ? `<span>💬 ${S.com[s.id]}</span>` : ''}</div>
    <div class="tm">${tm}</div>${pasosHTML(s)}</div>`;
}

  });
  document.querySelectorAll('[data-live-acc]').forEach(el => {
    const v = +el.dataset.liveAcc + segHabiles(el.dataset.desde, ahora);
    el.textContent = el.dataset.lbl + ' ⏱ ' + fmtDur(v);
    el.classList.toggle('late', clsMeta(segHabiles(el.dataset.desde, ahora), S.params.meta_paso_min) === 'late');
  });
  document.querySelectorAll('[data-live-tot]').forEach(el => {
    const v = segHabiles(el.dataset.liveTot, ahora);

    else el.textContent = fmtDur(v);
  });
}, 30000);

// ================== Estadísticas ==================
function rango(k){
  const h = hoyHN(), d = new Date(h + 'T12:00');
  const iso = x => x.toLocaleDateString('en-CA');
  if (k === 'hoy') return [h, h];
  if (k === '7d'){ const a = new Date(d); a.setDate(a.getDate()-6); return [iso(a), h]; }
  if (k === '30d'){ const a = new Date(d); a.setDate(a.getDate()-29); return [iso(a), h]; }
  if (k === 'mes') return [h.slice(0,8) + '01', h];
  if (k === 'mesant'){ const a = new Date(d.getFullYear(), d.getMonth()-1, 1, 12), b = new Date(d.getFullYear(), d.getMonth(), 0, 12); return [iso(a), iso(b)]; }
}

function barras(rows){
  const max = Math.max(1, ...rows.map(r => r[1]));
  return rows.map(([l, v, t, col]) => `<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l)}">${esc(l)}</span><div class="tr"><div class="fl" style="width:${v/max*100}%;${col ? 'background:' + col : ''}"></div></div><b>${esc(t)}</b></div>`).join('');
}
function graficoDias(el, data){
  if (!data.length) return el.innerHTML = '<div class="muted small">Sin datos</div>';
  const W = 640, H = 200, pl = 28, pb = 22, pt = 8, n = data.length;
  const max = Math.max(1, ...data.flatMap(d => [d.creadas, d.desembolsadas]));
  const step = (W - pl) / n, bw = Math.max(2, Math.min(14, step / 2 - 3));
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [...new Set([0, Math.round(max/2), max])];
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Solicitudes creadas y desembolsadas por día">`;
  ticks.forEach(t => svg += `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${t}</text>`);
  const r = (x, v, c) => { if (!v) return ''; const top = y(v), h = y(0) - top; const rr = Math.min(4, h, bw/2);
    return `<path d="M${x},${y(0)} v${-(h-rr)} q0,${-rr} ${rr},${-rr} h${bw-2*rr} q${rr},0 ${rr},${rr} v${h-rr} z" fill="${c}"/>`; };
  const every = Math.ceil(n / 8);
  data.forEach((d, i) => {
    const cx = pl + step * i + step / 2;
    svg += r(cx - bw - 1, d.creadas, 'var(--s1)') + r(cx + 1, d.desembolsadas, 'var(--s2)');
    if (i % every === 0) svg += `<text x="${cx}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${d.dia.slice(8)}/${d.dia.slice(5,7)}</text>`;
    svg += `<rect data-i="${i}" x="${pl + step*i}" y="0" width="${step}" height="${H-pb}" fill="transparent"/>`;
  });
  svg += `<line x1="${pl}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/></svg><div class="tip hidden"></div>`;
  el.innerHTML = svg;
  const tip = el.querySelector('.tip');
  el.querySelectorAll('rect[data-i]').forEach(rc => {
    const show = () => { const d = data[+rc.dataset.i]; const b = rc.getBoundingClientRect(), p = el.getBoundingClientRect();
      tip.innerHTML = `<b>${fDate(d.dia+'T12:00')}</b><br>Creadas: ${d.creadas}<br>Desembolsadas: ${d.desembolsadas}`;
      tip.style.left = Math.min(Math.max(b.left - p.left + b.width/2, 60), p.width - 60) + 'px'; tip.style.top = '40px'; tip.classList.remove('hidden'); };
    rc.addEventListener('mouseenter', show); rc.addEventListener('click', show);
    rc.addEventListener('mouseleave', () => tip.classList.add('hidden'));
  });
}

  $('#fAdd').onclick = e => run(e.target, async () => {
    if (!$('#fFecha').value) throw new Error('Seleccione la fecha');
    await rpc('guardar_feriado', { p_fecha: $('#fFecha').value, p_descripcion: $('#fDesc').value }); await cargarParams(); pintarParams(); toast('Feriado agregado');
  });
  $('#main').querySelectorAll('[data-fd]').forEach(b => b.onclick = () => run(b, async () => {
    if (!confirm('¿Quitar este feriado?')) return;
    await rpc('guardar_feriado', { p_fecha: b.dataset.fd, p_descripcion: null, p_borrar: true }); await cargarParams(); pintarParams();
  }));
}

// ================== Tiempo real ==================
let tRe = null, canal = null;
function suscribir(){
  if (canal) sb.removeChannel(canal);
  canal = sb.channel('vc')
    .on('postgres_changes', { event:'*', schema:'public', table:'solicitudes' }, p => { avisar(p); programarRecarga(p); })
    .on('postgres_changes', { event:'*', schema:'public', table:'comentarios' }, p => {
      const sid = p.new?.solicitud_id || p.old?.solicitud_id;
      if (S.det && (!sid || sid === S.det)) cargarComentarios();
      if (p.eventType === 'INSERT' && p.new.autor_id !== S.me.id && p.new.solicitud_id !== S.det){
        const s = S.sols.find(x => x.id === p.new.solicitud_id);
        if (s) notificar(`💬 ${nombre(p.new.autor_id)} comentó en ${s.nombre_cliente}`, p.new.texto.slice(0,80), s.id);
      }
      programarRecarga();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'comentario_likes' }, () => { if (S.det) cargarComentarios(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'ingresos' }, p => {
      const sid = p.new?.solicitud_id || p.old?.solicitud_id;
      if (S.det && sid === S.det && !S.dirty) recargarIngresos();
    })
    .subscribe(st => { if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setTimeout(suscribir, 5000); });
}
function programarRecarga(p){
  clearTimeout(tRe);
  tRe = setTimeout(async () => {
    const antes = S.det ? S.sols.find(x => x.id === S.det) : null;
    await cargarSolicitudes(); pintarTabs();
    if ($('#sheet').classList.contains('hidden')) pintar();
    else if (antes){
      const ahora = S.sols.find(x => x.id === S.det);
      if (ahora && ahora.estado !== antes.estado){
        if (S.dirty){ toast(`Esta solicitud cambió a "${EST[ahora.estado].t}". Cierre y vuelva a abrir para ver los cambios.`); }
        else abrirDetalle(S.det, true);
      }
    }
  }, 600);
}
function avisar(p){
  if (p.eventType !== 'UPDATE' && p.eventType !== 'INSERT') return;
  const s = p.new, prev = S.sols.find(x => x.id === s.id);
  if (prev && prev.estado === s.estado) return;
  const n = s.nombre_cliente;
  if (s.estado === 'en_analisis' && es('analista')) notificar('Nueva solicitud en análisis', `${n} · ${TIPO[s.tipo]}`, s.id);
  else if (['aprobada','denegada'].includes(s.estado) && s.asesor_id === S.me.id) notificar(`Solicitud ${EST[s.estado].t.toLowerCase()}`, n, s.id);
  else if (s.estado === 'borrador' && prev?.estado === 'en_analisis' && s.asesor_id === S.me.id) notificar('Solicitud devuelta para corregir', n, s.id);
  else if (s.estado === 'por_verificar' && rol() === 'verificador' && (!s.verificador_id || s.verificador_id === S.me.id)) notificar('Nueva verificación asignada', n, s.id);
  else if (s.estado === 'desembolso_pendiente' && es('analista')) notificar('Desembolso por transferencia pendiente', n, s.id);
}
function notificar(t, b, id){
  toast(`${t}: ${b}`);
  try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden){
    const nt = new Notification(t, { body: b, tag: 'vc-' + id }); nt.onclick = () => { window.focus(); abrirDetalle(id); };
  } } catch(e){}
}
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && S.me){ await cargarSolicitudes(); pintarTabs(); if ($('#sheet').classList.contains('hidden')) pintar(); }
});
setInterval(async () => { if (S.me && !document.hidden && $('#sheet').classList.contains('hidden')){ await cargarSolicitudes(); pintarTabs(); if (!document.activeElement || document.activeElement.id !== 'q') pintar(); } }, 60000);

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
init();
</script>
