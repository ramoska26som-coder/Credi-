<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A66">
<title>Planilla · Más Pisto</title>
<link rel="manifest" href="planilla.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{
  --azul:#1877F2; --azul2:#0B5AD6; --amarillo:#FFD400; --tinta:#0A2A66; --fondo:#F7FAFF;
  --blanco:#fff; --linea:#DCE6F5; --gris:#5B6B86; --gris2:#8A97AE; --suave:#EAF2FE;
  --verde:#0E9F6E; --rojo:#D93838; --naranja:#E8890C; --morado:#7A4CD9;
  --r-s:8px; --r-m:14px; --r-l:20px;
  --sombra:0 1px 2px rgba(10,42,102,.06),0 6px 20px -8px rgba(10,42,102,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Poppins,Inter,sans-serif;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700} h2{font-size:19px;font-weight:700} h3{font-size:16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul2)}
.hidden{display:none!important}
.num{font-family:Poppins,sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--gris)} .small{font-size:13px} .tiny{font-size:12px}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:100dvh;display:grid;grid-template-rows:1fr auto;background:var(--tinta);color:#fff}
.login-in{display:flex;flex-direction:column;justify-content:center;padding:32px 20px;max-width:420px;width:100%;margin:0 auto}
.marca{display:flex;align-items:baseline;gap:6px;font-family:Poppins;font-weight:800;font-size:30px;letter-spacing:-.03em}
.marca .p{color:var(--amarillo)}
.marca-sub{font-family:Poppins;font-weight:500;color:#AFC6F0;margin:4px 0 28px}
.login form{background:#fff;color:var(--tinta);border-radius:var(--r-l);padding:22px;display:grid;gap:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.login-pie{text-align:center;color:#7F98C7;font-size:12px;padding:16px}
.billetes{height:10px;background:repeating-linear-gradient(90deg,var(--amarillo) 0 28px,var(--azul) 28px 56px)}

/* ---------- forms ---------- */
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--gris)}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--linea);background:#fff;border-radius:var(--r-s);padding:10px 12px;font-size:15px;color:var(--tinta)}
.inp:focus{border-color:var(--azul);outline:none;box-shadow:0 0 0 3px rgba(24,119,242,.15)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.inp{min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--tinta);font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--azul)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--suave);color:var(--azul2);white-space:nowrap;min-height:42px}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--azul);color:#fff}
.btn.pri:hover{background:var(--azul2)}
.btn.ama{background:var(--amarillo);color:var(--tinta)}
.btn.rojo{background:#FDECEC;color:var(--rojo)}
.btn.borde{background:#fff;border:1.5px solid var(--linea);color:var(--tinta)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.err{background:#FDECEC;color:var(--rojo);border-radius:var(--r-s);padding:10px 12px;font-size:14px}

/* ---------- shell ---------- */
.shell{min-height:100dvh;display:grid;grid-template-columns:240px minmax(0,1fr);background:linear-gradient(90deg,var(--tinta) 240px,var(--fondo) 240px)}
.side{background:var(--tinta);color:#fff;padding:20px 14px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px}
.side .marca{font-size:22px;padding:0 10px 2px}
.side .marca-sub{font-size:12px;margin:0 10px 20px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#C9D8F5;text-decoration:none;font-weight:500}
.nav a svg{width:20px;height:20px;flex:none}
.nav a.on{background:rgba(255,255,255,.1);color:#fff}
.nav a.on svg{color:var(--amarillo)}
.badge{margin-left:auto;background:var(--amarillo);color:var(--tinta);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.bottom .badge{position:absolute;margin:0;transform:translate(14px,-4px)}
.bottom a{position:relative}
.nav-g{font-size:11px;color:#7F98C7;font-weight:600;padding:14px 12px 4px}
.side{overflow-y:auto}
.side-pie{margin-top:auto;padding:10px;font-size:13px;color:#9FB5E0;display:grid;gap:8px}
.side-pie button{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
main{padding:24px 28px 100px;max-width:1180px;width:100%;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top .acc{display:flex;gap:8px;flex-wrap:wrap}
.miga{font-size:13px;color:var(--gris);margin-bottom:4px}
.miga a{text-decoration:none}
.bottom{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);background:var(--fondo)}
  .side{display:none}
  main{padding:16px 16px 96px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--gris);text-decoration:none;padding:4px 0;font-weight:500}
  .bottom a svg{width:22px;height:22px}
  .bottom a.on{color:var(--azul2)}
  .mob-head{display:flex!important}
  h1{font-size:21px}
}
.mob-head{display:none;align-items:center;justify-content:space-between;background:var(--tinta);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:25}
.mob-head .marca{font-size:20px}
.mob-head button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px}

/* ---------- surfaces ---------- */
.panel{background:#fff;border:1px solid var(--linea);border-radius:var(--r-m);padding:16px}
.lista{display:grid;gap:10px}
.item{background:#fff;border:1px solid var(--linea);border-radius:var(--r-m);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none;color:inherit}
.item:hover{border-color:#B9CDEE}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--gris)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--suave);color:var(--azul2)}
.chip.ok{background:#E3F6EE;color:var(--verde)} .chip.warn{background:#FFF6CC;color:#8A6A00} .chip.red{background:#FDECEC;color:var(--rojo)} .chip.gris{background:#EEF1F6;color:var(--gris)}
.vacio{text-align:center;padding:36px 16px;color:var(--gris);background:#fff;border:1.5px dashed var(--linea);border-radius:var(--r-m)}
.vacio b{display:block;color:var(--tinta);font-family:Poppins;font-size:16px;margin-bottom:4px}

/* KPI strip (planilla period) */
.totales{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:var(--r-m);overflow:hidden;margin-bottom:16px}
.totales>div{background:#fff;padding:12px 14px}
.totales .k{font-size:12px;color:var(--gris);font-weight:500}
.totales .v{font-family:Poppins;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.totales .neto{background:var(--amarillo)}
.totales .neto .k{color:var(--tinta)}
@media (max-width:640px){.totales{grid-template-columns:1fr 1fr}.totales .v{font-size:17px}}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--linea);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--gris);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs a.on{color:var(--tinta);border-color:var(--azul)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--gris);font-size:12px;padding:8px 10px;border-bottom:1.5px solid var(--linea);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid #EEF2F8;vertical-align:middle}
table.t th.ordenable{cursor:pointer;user-select:none}
table.t th.ordenable:hover{color:var(--tinta)}
table.t th[aria-sort=ascending],table.t th[aria-sort=descending]{color:var(--azul2)}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#F7FAFF}
table.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;border-top:1.5px solid var(--linea);border-bottom:0}
.tscroll{overflow-x:auto;background:#fff;border:1px solid var(--linea);border-radius:var(--r-m)}

/* ---------- attendance grid ---------- */
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--gris);margin:0 0 12px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.m{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font-family:Poppins;font-weight:600;font-size:12px;border:0;cursor:pointer;position:relative}
.m-T{background:#E6F0FE;color:var(--azul2)} .m-F{background:#FDE2E2;color:var(--rojo)} .m-V{background:#E3F6EE;color:var(--verde)}
.m-I{background:#EFE7FD;color:var(--morado)} .m-P{background:#FFE9CC;color:#9A5A00} .m-L{background:#EEF1F6;color:var(--gris)} .m-N{background:#fff;color:#B5C0D3;border:1px dashed #C9D3E4}
.m.parcial::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--naranja)}
.m.extra::before{content:"";position:absolute;left:3px;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--amarillo);box-shadow:0 0 0 1px var(--tinta)}
.grid-asis{border-collapse:separate;border-spacing:0}
.grid-asis th,.grid-asis td{padding:4px 3px;text-align:center}
.grid-asis th{font-size:11px;color:var(--gris);font-weight:600;position:sticky;top:0;background:#fff}
.grid-asis th.dom{color:var(--rojo)}
.grid-asis td.n,.grid-asis th.n{text-align:left;position:sticky;left:0;background:#fff;z-index:2;padding-left:12px;min-width:150px;max-width:180px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--linea)}
.grid-asis td.h{font-family:Poppins;font-weight:600;font-size:13px;padding:0 12px;white-space:nowrap}

/* ---------- sheet / modal ---------- */
.velo{position:fixed;inset:0;background:rgba(10,42,102,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.hoja{background:#fff;border-radius:var(--r-l);width:100%;max-width:520px;max-height:92dvh;overflow:auto;padding:20px;box-shadow:0 30px 60px -20px rgba(10,42,102,.5)}
.hoja.ancha{max-width:860px}
.hoja-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hoja-top .x{background:var(--suave);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;color:var(--tinta)}
.hoja form{display:grid;gap:12px}
.hoja .pie{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
@media (max-width:640px){.velo{align-items:flex-end;padding:0}.hoja{border-radius:var(--r-l) var(--r-l) 0 0;max-height:94dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
.marcas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.marcas button{border:1.5px solid var(--linea);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:500}
.marcas button.on{border-color:var(--azul);box-shadow:0 0 0 3px rgba(24,119,242,.15)}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-weight:500;box-shadow:var(--sombra);max-width:90vw}
.toast.mal{background:var(--rojo)}
.cargando{padding:40px;text-align:center;color:var(--gris)}

/* ---------- comprobante (pay stub) ---------- */
.cp{background:#fff;border-radius:var(--r-m);overflow:hidden;box-shadow:var(--sombra);max-width:780px;margin:0 auto;border:1px solid var(--linea);position:relative}
.cp-cab{background:var(--tinta);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.cp-cab .marca{font-size:24px}
.cp-cab .tit{font-family:Poppins;font-weight:600;font-size:14px;color:#AFC6F0;margin-top:2px}
.cp-cab .nro{text-align:right;font-size:12px;color:#AFC6F0}
.cp-cab .nro b{display:block;font-family:Poppins;color:#fff;font-size:16px;white-space:nowrap}
.cp-cab .nro .chip{margin-top:4px}
.cp-quien{padding:16px 22px 6px;display:grid;grid-template-columns:1.4fr 1fr;gap:6px 24px}
.cp-quien .nom{font-family:Poppins;font-weight:700;font-size:19px;grid-column:1/-1}
.cp-dato{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px dotted var(--linea);padding:4px 0}
.cp-dato span:first-child{color:var(--gris)}
.cp-dato span:last-child{font-weight:600;text-align:right}
.cp-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:12px;border-top:1px solid var(--linea)}
.cp-col{padding:14px 22px}
.cp-col+.cp-col{border-left:1px solid var(--linea)}
.cp-col h4{font-size:13px;color:var(--gris);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.cp-l{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid #F0F3F9;font-size:14px}
.cp-l .mt{font-family:Poppins;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.cp-l .dt{grid-column:1/-1;font-size:12px;color:var(--gris)}
.cp-l .sal{grid-column:1/-1;font-size:12px;color:var(--azul2)}
.cp-tot{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;font-size:14px}
.cp-neto{background:var(--amarillo);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;position:relative}
.cp-neto::before{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;background:radial-gradient(circle at 6px 6px,#fff 4.5px,transparent 5px) 0 0/16px 12px repeat-x}
.cp-neto .k{font-family:Poppins;font-weight:600}
.cp-neto .k small{display:block;font-family:Inter;font-weight:500;font-size:12px;color:#5C4A00}
.cp-neto .v{font-family:Poppins;font-weight:800;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cp-asis{padding:10px 22px;font-size:12px;color:var(--gris);display:flex;flex-wrap:wrap;gap:6px 16px;border-top:1px solid var(--linea)}
.cp-recibido{padding:12px 22px;font-size:13px;color:var(--verde);font-weight:600;background:#F1FBF6;border-top:1px solid var(--linea)}
.filtros{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.filtros .fechas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;flex:1;min-width:260px}
.filtros .fechas .f{gap:2px;font-size:12px}
@media (max-width:640px){.filtros>select,.filtros .fechas{width:100%;flex-basis:100%}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.acciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.accion{background:#fff;border:1px solid var(--linea);border-radius:var(--r-m);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--tinta);font-weight:600;font-size:13px;text-align:center}
.accion svg{width:24px;height:24px;color:var(--azul)}
.accion:hover{border-color:#B9CDEE}
.constancia .cons-cuerpo{padding:28px 40px 30px;font-size:15px;line-height:1.7}
.constancia h2{text-align:center;margin-bottom:22px;font-size:20px}
.constancia .cons-firma{display:flex;justify-content:center;margin-top:70px}
.constancia .cons-firma div{border-top:1px solid var(--tinta);padding-top:6px;min-width:260px;text-align:center;font-weight:600}
.constancia .cons-firma span{font-weight:400;color:var(--gris)}
button.lnk{background:none;border:0;padding:0;color:var(--azul2);font-weight:600;cursor:pointer;font:inherit;text-decoration:underline dotted}
@media (max-width:760px){.liq{grid-template-columns:1fr!important}.constancia .cons-cuerpo{padding:20px}}
.cp-firma{display:none;padding:34px 22px 18px;grid-template-columns:1fr 1fr;gap:40px;font-size:12px;color:var(--gris);text-align:center}
.cp-firma div{border-top:1px solid var(--tinta);padding-top:6px}
@media (max-width:640px){
  .cp-quien{grid-template-columns:1fr}
  .cp-cols{grid-template-columns:1fr}
  .cp-col+.cp-col{border-left:0;border-top:1px solid var(--linea)}
  .cp-neto .v{font-size:25px}
}

/* empleado home */
.hola{background:var(--tinta);color:#fff;border-radius:var(--r-l);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hola .k{color:#AFC6F0;font-size:13px}
.hola .v{font-family:Poppins;font-weight:800;font-size:32px;color:var(--amarillo);font-variant-numeric:tabular-nums;line-height:1.1}
.hola .s{font-size:13px;color:#C9D8F5;margin-top:4px}
.pago{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.pago .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:Poppins;font-weight:700;font-size:13px}
.pago .ic.s{background:#E6F0FE;color:var(--azul2)} .pago .ic.c{background:#FFF6CC;color:#8A6A00}
.barra{height:8px;background:#EEF2F8;border-radius:99px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--azul);border-radius:99px}
.segm{display:inline-flex;background:#fff;border:1px solid var(--linea);border-radius:999px;padding:3px;gap:2px}
.segm button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--gris);cursor:pointer;font-size:13px}
.segm button.on{background:var(--tinta);color:#fff}

/* ---------- print ---------- */
#imprimir{display:none}
@media print{
  @page{size:letter;margin:12mm}
  body{background:#fff}
  body>*:not(#imprimir){display:none!important}
  #imprimir{display:block!important}
  .cp{box-shadow:none;border:1px solid #999;page-break-inside:avoid;break-inside:avoid;margin-bottom:10mm}
  .cp-firma{display:grid!important}
  .cp-neto,.cp-cab,.totales .neto{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cp + .cp{page-break-before:always}
}
@media (prefers-reduced-motion:no-preference){
  .hoja{animation:sube .18s ease-out}
  @keyframes sube{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

function hoja(titulo, html, { ancha = false } = {}) {
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = `<div class="hoja ${ancha ? 'ancha' : ''}" role="dialog" aria-modal="true"><div class="hoja-top"><h2>${esc(titulo)}</h2><button class="x" aria-label="Cerrar">×</button></div><div class="hoja-c">${html}</div></div>`;
  const cerrar = () => { v.remove(); document.removeEventListener('keydown', k); };
  const k = e => { if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', k);
  v.addEventListener('click', e => { if (e.target === v) cerrar(); });
  $('.x', v).onclick = cerrar;
  document.body.appendChild(v);
  setTimeout(() => $('input:not([type=hidden]),select', v)?.focus(), 30);
  return { el: v, cerrar };
}
function confirmar(titulo, texto, ok = 'Confirmar', peligro = false) {
  return new Promise(res => {
    const h = hoja(titulo, `<p class="muted" style="margin:0 0 16px">${texto}</p><div class="pie"><button class="btn borde" data-n>Cancelar</button><button class="btn ${peligro ? 'rojo' : 'pri'}" data-s>${esc(ok)}</button></div>`);
    $('[data-n]', h.el).onclick = () => { h.cerrar(); res(false); };
    $('[data-s]', h.el).onclick = () => { h.cerrar(); res(true); };
  });
}

async function empleadosActivos() { return q(sb.from('pl_empleados').select('id,nombre,activo,recibe_salario,recibe_comisiones').order('nombre')); }
async function periodosAbiertos() { return q(sb.from('pl_periodos').select('*').eq('estado', 'abierta').order('fecha_inicio', { ascending: false })); }
async function conceptos() { if (!S.conceptos) S.conceptos = await q(sb.from('pl_conceptos').select('*').eq('activo', true).order('orden')); return S.conceptos; }

// En "Mis pagos" no se restan adelantos, vales ni cuotas de préstamos: es dinero que el empleado ya recibió
const esAnticipo = d => !!d.prestamo_id || /^(adelanto|vales?\b|vale comisiones|préstamo|prestamo)/i.test(String(d.concepto || '').trim());
const anticipado = c => (c?.deducciones || []).filter(esAnticipo).reduce((a, d) => a + +d.monto, 0);
const ganado = comp => +comp.neto + anticipado(comp.datos); // ingresos menos penalizaciones y otras deducciones reales
function resumenFila(c) {
  const ded = c.deducciones || [];
  const adel = ded.filter(d => /^Adelanto|^Vales \/ adelantos/.test(d.concepto)).reduce((a, d) => a + +d.monto, 0);
  const pres = ded.filter(d => d.prestamo_id).reduce((a, d) => a + +d.monto, 0);
  const otras = +c.total_deducciones - adel - pres;
  return { adel, pres, otras };
}

function sugerencia(tipo, per) {
  if (tipo === 'salario') {
    const ult = per.filter(p => p.tipo === 'salario').sort((a, b) => b.fecha_fin.localeCompare(a.fecha_fin))[0];
    let ini = ult ? pf(ult.fecha_fin) : hoyHN(); if (ult) ini.setDate(ini.getDate() + 1);
    else { const h = hoyHN(); ini = h.getDate() >= 4 && h.getDate() <= 18 ? new Date(h.getFullYear(), h.getMonth(), 4) : (h.getDate() > 18 ? new Date(h.getFullYear(), h.getMonth(), 19) : new Date(h.getFullYear(), h.getMonth() - 1, 19)); }
    const primera = ini.getDate() === 4;
    const fin = primera ? new Date(ini.getFullYear(), ini.getMonth(), 18) : new Date(ini.getFullYear(), ini.getMonth() + 1, 3);
    const codigo = `${ini.getFullYear()}${String(ini.getMonth() + 1).padStart(2, '0')}${primera ? '01' : '02'}`;
    const nombre = `${primera ? '1ª' : '2ª'} quincena de ${MESES[ini.getMonth()]} ${ini.getFullYear()}`;
    return { codigo, nombre, ini: iso(ini), fin: iso(fin), pago: iso(fin) };
  }
  const ult = per.filter(p => p.tipo === 'comisiones').sort((a, b) => b.fecha_fin.localeCompare(a.fecha_fin))[0];
  let ini;
  if (ult) { ini = pf(ult.fecha_fin); ini.setDate(ini.getDate() + 1); }
  else { const h = hoyHN(); ini = new Date(h.getFullYear(), h.getMonth() - (h.getDate() >= 9 ? 1 : 2), 9); }
  const fin = new Date(ini.getFullYear(), ini.getMonth() + 1, 8);
  const pago = new Date(ini.getFullYear(), ini.getMonth() + 1, 15);
  return { codigo: `C${ini.getFullYear()}${String(ini.getMonth() + 1).padStart(2, '0')}`, nombre: `Comisiones ${MESES[ini.getMonth()]} ${ini.getFullYear()}`, ini: iso(ini), fin: iso(fin), pago: iso(pago) };
}

    <input type="hidden" name="tipo" value="salario">

    <div class="row2"><label class="f">Desde<input class="inp" type="date" name="fecha_inicio" required></label><label class="f">Hasta<input class="inp" type="date" name="fecha_fin" required></label></div>

  $$('.segm button', h.el).forEach(b => b.onclick = () => { $$('.segm button', h.el).forEach(x => x.classList.toggle('on', x === b)); llenar(b.dataset.t); });

  f.onsubmit = async e => {

  };
}

  const T = calc.reduce((a, c) => ({ ing: a.ing + +c.total_ingresos, ded: a.ded + +c.total_deducciones, neto: a.neto + +c.neto }), { ing: 0, ded: 0, neto: 0 });
  const tabs = [['resumen', 'Planilla general'], ...(per.tipo === 'salario' ? [['asistencia', 'Asistencia']] : []), ['movimientos', per.tipo === 'salario' ? 'Otros ingresos y deducciones' : 'Comisiones y deducciones'], ['adelantos', 'Adelantos'], ['comprobantes', 'Comprobantes']];

    try { const n = await q(sb.rpc('pl_cerrar_periodo', { p_periodo: id })); toast(`${n} comprobantes generados`); vPeriodo(id, 'comprobantes'); } catch (e) { toast(errMsg(e), true); }
  });
  $('#reabrir', m) && ($('#reabrir', m).onclick = async () => {
    if (!await confirmar('Reabrir planilla', 'Los comprobantes quedarán anulados y se revertirán los abonos a préstamos de esta planilla. Al cerrarla de nuevo se vuelven a generar.', 'Reabrir', true)) return;

  });
  $('#editp', m) && ($('#editp', m).onclick = () => editarPeriodo(per));
  if (tab === 'resumen') return tabResumen(cont, per, calc, T);

  if (tab === 'movimientos') return tabMovimientos(cont, per, calc);

function tabResumen(cont, per, calc, T) {

  const filas = calc.map((c, i) => ({ c, i, ...resumenFila(c) }));
  const ef = calc.filter(c => c.metodo_pago === 'EFECTIVO').reduce((a, c) => a + +c.neto, 0);
  const bancos = {}; calc.filter(c => c.metodo_pago !== 'EFECTIVO').forEach(c => { const b = c.banco || 'Sin banco'; bancos[b] = (bancos[b] || 0) + +c.neto; });
  cont.innerHTML = `
    <div class="tscroll"><table class="t">
      <thead><tr><th>#</th><th>Empleado</th><th class="r">Planilla</th><th class="r">Adelantos</th><th class="r">Préstamos</th><th class="r">Otras ded.</th><th class="r">A pagar</th><th>Pago</th></tr></thead>
      <tbody>${filas.map(({ c, i, adel, pres, otras }) => `<tr class="click" data-e="${c.empleado_id}"><td class="muted">${i + 1}</td><td><b>${esc(c.nombre)}</b>${c.asistencia && c.asistencia.registros === 0 ? ' <span class="chip red">sin asistencia</span>' : ''}</td><td class="r">${L(c.total_ingresos)}</td><td class="r">${adel ? L(adel) : '—'}</td><td class="r">${pres ? L(pres) : '—'}</td><td class="r">${otras > 0.004 ? L(otras) : '—'}</td><td class="r num">${L(c.neto)}</td><td class="small">${esc(c.metodo_pago === 'EFECTIVO' ? 'Efectivo' : (c.banco || 'Transferencia'))}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td></td><td>Total</td><td class="r">${L(T.ing)}</td><td class="r">${L(filas.reduce((a, f) => a + f.adel, 0))}</td><td class="r">${L(filas.reduce((a, f) => a + f.pres, 0))}</td><td class="r">${L(filas.reduce((a, f) => a + Math.max(0, f.otras), 0))}</td><td class="r">${L(T.neto)}</td><td></td></tr></tfoot>
    </table></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px">
      <div class="panel"><h3 style="margin-bottom:8px">Forma de pago</h3>
        <div class="cp-dato"><span>Efectivo</span><span>${L(ef)}</span></div>
        ${Object.entries(bancos).map(([b, v]) => `<div class="cp-dato"><span>Transferencia ${esc(b)}</span><span>${L(v)}</span></div>`).join('')}
        <div class="cp-dato" style="border:0"><span><b>Total transferencias</b></span><span>${L(T.neto - ef)}</span></div></div>
      <div class="panel" style="display:flex;flex-direction:column;gap:8px;justify-content:center">
        <button class="btn borde" id="xls">${ICON.excel}Descargar Excel</button>
        <button class="btn borde" id="imp">${ICON.print}Imprimir todos los comprobantes</button></div>
    </div>`;
  $$('tr[data-e]', cont).forEach(tr => tr.onclick = () => location.hash = `#/comp/${per.id}/${tr.dataset.e}`);
  $('#imp', cont).onclick = () => imprimir(calc.map(c => ({ c, numero: c.numero })), per);
  $('#xls', cont).onclick = () => excelPlanilla(per, calc);
}

function excelPlanilla(per, calc) {
  if (!window.XLSX) return toast('Cargando librería de Excel, intenta de nuevo', true);
  const filas = calc.map((c, i) => { const r = resumenFila(c); return { '#': i + 1, 'Nombre': c.nombre, 'Planilla (ingresos)': +c.total_ingresos, 'Adelantos': r.adel, 'Préstamos': r.pres, 'Otras deducciones': +r.otras.toFixed(2), 'Deducciones': +c.total_deducciones, 'Monto a pagar': +c.neto, 'Método de pago': c.metodo_pago, 'Banco': c.banco || '', 'Cuenta': c.cuenta || '' }; });
  const det = [];
  calc.forEach(c => {
    (c.ingresos || []).forEach(x => det.push({ Nombre: c.nombre, Tipo: 'Ingreso', Concepto: x.concepto, Tiempo: x.tiempo ?? '', Tarifa: x.tarifa ?? '', Monto: +x.monto, Saldo: '', Detalle: x.detalle || '' }));
    (c.deducciones || []).forEach(x => det.push({ Nombre: c.nombre, Tipo: 'Deducción', Concepto: x.concepto, Tiempo: '', Tarifa: '', Monto: +x.monto, Saldo: x.saldo ?? '', Detalle: x.detalle || '' }));
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(filas); ws['!cols'] = [{ wch: 4 }, { wch: 34 }, ...Array(6).fill({ wch: 14 }), { wch: 15 }, { wch: 12 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Planilla');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(det), 'Detalle');
  XLSX.writeFile(wb, `Planilla_${per.codigo}.xlsx`);
}

/* ---------- asistencia ---------- */
const MARCAS = { T: 'Trabajado', F: 'Falta', V: 'Vacaciones', I: 'Incapacidad', P: 'Permiso sin goce', L: 'Libre / permiso con goce', N: 'No laboraba aún' };
const HORAS_MARCA = { T: 8, F: 0, V: 8, I: 8, P: 0, L: 8, N: 0 };
async function tabAsistencia(cont, per, recargar = () => vPeriodo(per.id, 'asistencia')) {
  const abierta = per.estado === 'abierta';
  const datos = await q(sb.rpc('pl_asistencia_periodo', { p_periodo: per.id }));
  const rows = datos.registros, emps = datos.empleados;
  const dias = []; for (let d = pf(per.fecha_inicio); d <= pf(per.fecha_fin); d.setDate(d.getDate() + 1)) dias.push(new Date(d));
  const map = {}; rows.forEach(r => map[r.empleado_id + '|' + r.fecha] = r);
  const ids = [...new Set(rows.map(r => r.empleado_id))];
  const lista = emps.filter(e => ids.includes(e.id));
  const horasPag = id => { const rs = rows.filter(r => r.empleado_id === id); return Math.max(0, 120 - rs.reduce((a, r) => a + Math.max(0, 8 - +r.horas), 0)); };
  cont.innerHTML = `
    <div class="leyenda">${Object.entries(MARCAS).map(([k, t]) => `<span><i class="m m-${k}" style="width:22px;height:22px;cursor:default">${k}</i>${t}</span>`).join('')}
      <span><i class="m m-T parcial" style="width:22px;height:22px;cursor:default"></i>Horas parciales / llegada tarde</span><span><i class="m m-T extra" style="width:22px;height:22px;cursor:default"></i>Horas extra / feriado</span></div>
    ${lista.length ? `<div class="tscroll"><table class="grid-asis">
      <thead><tr><th class="n">Empleado</th>${dias.map(d => `<th class="${d.getDay() === 0 ? 'dom' : ''}">${DIAS[d.getDay()]}<br>${d.getDate()}</th>`).join('')}<th>Horas</th></tr></thead>
      <tbody>${lista.map(e => `<tr><td class="n" title="${esc(e.nombre)}">${esc(corto(e.nombre))}</td>${dias.map(d => { const r = map[e.id + '|' + iso(d)]; if (!r) return `<td><button class="m m-N" data-e="${e.id}" data-f="${iso(d)}" ${abierta ? '' : 'disabled'}>·</button></td>`; const parcial = (r.marca === 'T' && +r.horas < 8) || r.minutos_tarde > 0; const extra = +r.horas_extra > 0 || r.feriado; return `<td><button class="m m-${r.marca} ${parcial ? 'parcial' : ''} ${extra ? 'extra' : ''}" data-e="${e.id}" data-f="${r.fecha}" title="${esc(MARCAS[r.marca])} · ${N(r.horas)} h${r.minutos_tarde ? ' · ' + r.minutos_tarde + ' min tarde' : ''}${+r.horas_extra ? ' · ' + N(r.horas_extra) + ' h extra' : ''}${r.nota ? ' · ' + r.nota : ''}" ${abierta ? '' : 'disabled'}>${r.marca === 'T' && +r.horas < 8 ? N(r.horas) : r.marca}</button></td>`; }).join('')}<td class="h">${N(horasPag(e.id))}</td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="vacio"><b>No hay asistencia generada</b>Genera 8 horas diarias para los empleados con salario.</div>`}
    ${abierta ? `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn borde sm" id="gen">Agregar empleados faltantes</button><span class="small muted" style="align-self:center">Toca un día para marcar falta, vacaciones, horas extra o llegada tarde. La quincena se paga sobre 120 horas.</span></div>` : ''}`;
  $('#gen', cont) && ($('#gen', cont).onclick = async () => { try { const n = await q(sb.rpc('pl_generar_asistencia', { p_periodo: per.id })); toast(n ? `${n} días agregados` : 'No faltaba nadie'); recargar(); } catch (e) { toast(errMsg(e), true); } });
  if (!abierta) return;
  $$('button.m[data-e]', cont).forEach(b => b.onclick = () => editarDia(per, lista.find(e => e.id === b.dataset.e), b.dataset.f, map[b.dataset.e + '|' + b.dataset.f], recargar));
}

  cargando();

  const per = pers.find(p => p.id === perId) || pers.find(p => p.estado === 'abierta') || pers[0];
  if (!per) return shell('<div class="vacio"><b>Aún no hay planillas de salario</b>Cuando administración cree la quincena, aquí podrás marcar la asistencia.</div>');
  const m = shell(`<div class="top"><div><h1>Asistencia</h1><div class="muted small">${rango(per.fecha_inicio, per.fecha_fin)} · ${per.estado === 'abierta' ? '<span class="chip warn">Abierta</span>' : '<span class="chip ok">Cerrada, solo lectura</span>'}</div></div>
    <div class="acc"><select class="inp" id="selp" style="width:auto">${pers.map(p => `<option value="${p.id}" ${p.id === per.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div></div><div id="tab"></div>`);
  $('#selp', m).onchange = e => location.hash = `#/asistencia/${e.target.value}`;
  await tabAsistencia($('#tab', m), per, () => vAsistenciaSup(per.id));
}

  ids.sort((a, b) => nombre(a).localeCompare(nombre(b)));

    ${abierta ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap"><span class="small muted">${per.tipo === 'comisiones' ? 'Registra comisiones, bonos y deducciones de cada colaborador. Los préstamos marcados “en comisiones” y los vales/adelantos se agregan solos.' : 'Vacaciones, décimo tercer/cuarto mes, combustible u otras deducciones. El salario, seguro y préstamos se calculan solos.'}</span><div style="display:flex;gap:8px;flex-wrap:wrap">${per.tipo === 'salario' ? `<button class="btn borde" id="d13">Calcular décimo tercer mes</button><button class="btn borde" id="d14">Calcular décimo cuarto mes</button><button class="btn borde" id="comb">${ICON.moto}Agregar combustible</button>` : ''}<button class="btn ama" id="cap">Capturar con plantillas</button><button class="btn pri" id="add">${ICON.mas}Agregar línea</button></div></div>` : ''}
    ${ids.length ? `<div class="lista">${ids.map(id => { const c = calc.find(x => x.empleado_id === id); const ls = porEmp[id] || []; return `
      <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><h3>${esc(nombre(id))}</h3>${c ? `<span class="num">${L(c.neto)}</span>` : ''}</div>
      ${ls.length ? `<table class="t"><tbody>${ls.map(mv => `<tr class="${abierta ? 'click' : ''}" data-m="${mv.id}"><td style="width:28px"><span class="chip ${mv.tipo === 'ingreso' ? 'ok' : 'red'}" style="padding:0 7px">${mv.tipo === 'ingreso' ? '+' : '−'}</span></td><td>${esc(mv.concepto)}${mv.detalle ? `<div class="tiny muted">${esc(mv.detalle)}</div>` : ''}</td><td class="r num">${L(mv.monto)}</td></tr>`).join('')}</tbody></table>` : '<div class="small muted">Sin líneas manuales</div>'}
      ${abierta ? `<button class="btn sm" style="margin-top:8px" data-add="${id}">${ICON.mas}Agregar a ${esc(corto(nombre(id)))}</button>` : ''}</div>`; }).join('')}</div>`
      : `<div class="vacio"><b>Sin líneas todavía</b>Agrega la primera comisión o ajuste.</div>`}`;
  if (!abierta) return;
  $('#add', cont).onclick = () => editarMov(per, null, null, emps);
  $('#cap', cont).onclick = () => capturarPlantillas(per);
  const decimo = t => {
    const y = pf(per.fecha_fin).getFullYear();
    const def = t === '13' ? `${y}-12-31` : `${y}-06-30`;
    const h = hoja(t === '13' ? 'Décimo tercer mes' : 'Décimo cuarto mes', `<form><p class="small muted" style="margin:0">Se calcula para cada empleado con salario: salario mensual × días laborados en el período ÷ 360. ${t === '13' ? 'Período: 1 de enero al 31 de diciembre.' : 'Período: 1 de julio al 30 de junio.'} Si ya existe la línea, se actualiza.</p>
      <label class="f">Calcular hasta<input class="inp" type="date" name="corte" value="${def}" required></label>
      <div class="pie"><button class="btn pri">Calcular y agregar</button></div></form>`);

  };
  $('#d13', cont) && ($('#d13', cont).onclick = () => decimo('13'));
  $('#d14', cont) && ($('#d14', cont).onclick = () => decimo('14'));
  $('#comb', cont) && ($('#comb', cont).onclick = async () => { try { const r = await q(sb.rpc('pl_combustible_a_planilla', { p_periodo: per.id })); const inc = r.detalle.filter(x => +x.incompletos).map(x => corto(x.nombre)); toast(r.agregados ? `Combustible agregado a ${r.agregados} empleado(s)${inc.length ? ' · días sin fin: ' + inc.join(', ') : ''}` : 'No hay kilómetros registrados en este período', !r.agregados); vPeriodo(per.id, 'movimientos'); } catch (er) { toast(errMsg(er), true); } });
  $$('[data-add]', cont).forEach(b => b.onclick = () => editarMov(per, null, b.dataset.add, emps));

async function editarMov(per, mv, empId, emps) {
  const [cs0, plants, empsA] = await Promise.all([conceptos(), q(sb.from('pl_plantillas').select('*')), q(sb.from('pl_empleados').select('id,area,cargo'))]);
  const cs = cs0.filter(c => c.aplica === 'ambos' || c.aplica === per.tipo);
  mv = mv || { tipo: 'ingreso', concepto: '', monto: '', detalle: '', empleado_id: empId };
  const h = hoja(mv.id ? 'Editar línea' : 'Agregar línea', `<form>
    <label class="f">Empleado<select class="inp" name="empleado_id" required><option value="">Elegir…</option>${emps.filter(e => e.activo || e.id === mv.empleado_id).map(e => `<option value="${e.id}" ${e.id === mv.empleado_id ? 'selected' : ''}>${esc(e.nombre)}</option>`).join('')}</select></label>
    <div class="segm"><button type="button" data-t="ingreso" class="${mv.tipo === 'ingreso' ? 'on' : ''}">Ingreso</button><button type="button" data-t="deduccion" class="${mv.tipo === 'deduccion' ? 'on' : ''}">Deducción</button></div>
    <input type="hidden" name="tipo" value="${mv.tipo}">
    <label class="f">Concepto<input class="inp" name="concepto" list="dl-con" value="${esc(mv.concepto)}" required placeholder="Escribe o elige" autocomplete="off"></label>
    <datalist id="dl-con"></datalist>
    <label class="f">Cómo se calcula<select class="inp" name="modo">
      <option value="plantilla" hidden>Según la plantilla del empleado</option>
      <option value="unitario">Cantidad × valor por unidad (ej.: cuentas canceladas × L 300)</option>
      <option value="porcentaje">Porcentaje de un monto (ej.: intereses cobrados × 5%)</option>
      <option value="fijo">Escribir el monto directo</option></select></label>
    <div class="small" id="regla" style="color:var(--azul2);font-weight:600"></div>
    <div class="row2" id="campos"><label class="f" id="lcant">Cantidad<input class="inp" type="number" step="any" min="0" name="cantidad" inputmode="decimal"></label><label class="f" id="lval">Valor por unidad (L)<input class="inp" type="number" step="any" min="0" name="valor" inputmode="decimal"></label></div>
    <label class="f">Monto (L)<input class="inp" type="number" step="1" min="0" name="monto" value="${mv.monto}" required></label>
    <label class="f">Detalle del cálculo<input class="inp" name="detalle" value="${esc(mv.detalle || '')}" placeholder="Aparece en el comprobante"></label>
    <label class="chk" id="lguardar"><input type="checkbox" name="guardar">Guardar este cálculo para este empleado (la próxima vez solo pones la cantidad)</label>
    <div class="pie">${mv.id ? '<button type="button" class="btn rojo" id="del">Eliminar</button>' : ''}<button class="btn pri">${mv.id ? 'Guardar cambios' : 'Agregar línea'}</button></div></form>`);
  const f = $('form', h.el);
  const empObj = () => { const id = f.empleado_id.value; const a = empsA.find(x => x.id === id) || {}; return { id, area: a.area, cargo: a.cargo }; };
  const plDe = () => f.empleado_id.value ? plantillasDe(empObj(), per.tipo, plants) : [];
  const actual = () => plDe().find(p => p.tipo === f.tipo.value && p.concepto.trim().toLowerCase() === f.concepto.value.trim().toLowerCase());
  const dl = () => { const propios = plDe().filter(p => p.tipo === f.tipo.value).map(p => p.concepto); $('#dl-con', h.el).innerHTML = [...new Set([...propios, ...cs.filter(c => c.tipo === f.tipo.value).map(c => c.nombre)])].map(n => `<option value="${esc(n)}">`).join(''); };
  let pl = null;
  const ui = () => {
    const modo = f.modo.value; const p = modo === 'plantilla' ? pl : null;
    $('#campos', h.el).classList.toggle('hidden', modo === 'fijo' && !p);
    if (p && p.calculo === 'fijo') $('#campos', h.el).classList.toggle('hidden', true);
    $('#lval', h.el).classList.toggle('hidden', !!p);
    $('#lcant', h.el).firstChild.textContent = p ? (p.etiqueta || (p.calculo === 'porcentaje' ? 'Monto (L)' : 'Cantidad')) : modo === 'porcentaje' ? 'Monto base (L)' : 'Cantidad';
    $('#lval', h.el).firstChild.textContent = modo === 'porcentaje' ? 'Porcentaje (%)' : 'Valor por unidad (L)';
    $('#regla', h.el).textContent = p ? `Cálculo guardado: ${reglaPlantilla(p)}` : '';
    f.monto.readOnly = !!p ? p.calculo !== 'fijo' : modo !== 'fijo';
    $('#lguardar', h.el).classList.toggle('hidden', !!p || modo === 'fijo' || !f.empleado_id.value);
    calc();
  };
  const calc = () => {
    const modo = f.modo.value;
    if (modo === 'fijo' || (modo === 'plantilla' && pl?.calculo === 'fijo')) { if (modo === 'plantilla') f.cantidad.value = f.monto.value; return; }
    const p = modo === 'plantilla' ? pl : { calculo: modo, valor: +f.valor.value || 0, factor: 100 };
    if (f.cantidad.value === '') { f.monto.value = ''; return; }
    const r = calcPlantilla(p, f.cantidad.value);
    f.monto.value = r.monto; f.detalle.value = r.detalle || '';
  };
  const detectar = (inicial = false) => {
    pl = actual();
    if (pl) { f.modo.value = 'plantilla'; $('option[value=plantilla]', f).hidden = false; }
    else { $('option[value=plantilla]', f).hidden = true; if (f.modo.value === 'plantilla' || inicial) f.modo.value = mv.cantidad != null && /×\s*L/.test(mv.detalle || '') ? 'unitario' : mv.cantidad != null ? 'porcentaje' : (inicial && mv.id ? 'fijo' : 'unitario'); }
    ui();
  };
  if (mv.cantidad != null) f.cantidad.value = mv.cantidad;
  dl(); detectar(true);
  if (mv.id && !pl && mv.cantidad == null) { f.modo.value = 'fijo'; ui(); }
  $$('.segm button', h.el).forEach(b => b.onclick = () => { $$('.segm button', h.el).forEach(x => x.classList.toggle('on', x === b)); f.tipo.value = b.dataset.t; dl(); detectar(); });
  f.empleado_id.onchange = () => { dl(); detectar(); };
  f.concepto.oninput = () => detectar();
  f.modo.onchange = ui;
  f.cantidad.oninput = calc; f.valor.oninput = calc;
  f.monto.oninput = () => { if (f.modo.value === 'plantilla' && pl?.calculo === 'fijo') f.cantidad.value = f.monto.value; };
  f.onsubmit = async e => {
    e.preventDefault(); const x = formData(f);
    const usaCant = x.modo !== 'fijo' && !(x.modo === 'plantilla' && pl?.calculo === 'fijo');
    const row = { periodo_id: per.id, empleado_id: x.empleado_id, tipo: x.tipo, concepto: x.concepto.trim(), monto: Math.round(+x.monto), detalle: x.detalle || null,
      cantidad: usaCant && x.cantidad !== '' ? +x.cantidad : (x.modo === 'plantilla' ? +x.monto : null), plantilla_id: x.modo === 'plantilla' ? pl.id : null };
    const orden = cs.find(c => c.nombre === row.concepto)?.orden; if (orden) row.orden = orden;
    try {
      if (x.guardar && (x.modo === 'unitario' || x.modo === 'porcentaje') && +x.valor > 0) {
        const nueva = await q(sb.from('pl_plantillas').insert({ empleado_id: x.empleado_id, aplica: per.tipo, tipo: x.tipo, concepto: row.concepto, calculo: x.modo, valor: +x.valor, factor: 100,
          etiqueta: x.modo === 'porcentaje' ? 'Monto base (L)' : 'Cantidad', orden: row.orden || 100 }).select().single());
        row.plantilla_id = nueva.id;
      }
      if (mv.id) await q(sb.from('pl_movimientos').update(row).eq('id', mv.id)); else await q(sb.from('pl_movimientos').insert(row));
      h.cerrar(); toast(mv.id ? 'Cambios guardados' : 'Línea agregada'); vPeriodo(per.id, 'movimientos');
    } catch (er) { toast(errMsg(er), true); }
  };
  $('#del', h.el) && ($('#del', h.el).onclick = async () => { try { await q(sb.from('pl_movimientos').delete().eq('id', mv.id)); h.cerrar(); toast('Línea eliminada'); vPeriodo(per.id, 'movimientos'); } catch (er) { toast(errMsg(er), true); } });
}

    <div class="pie">${a.id ? '<button type="button" class="btn rojo" id="del">Eliminar</button>' : ''}<button class="btn pri">${a.id ? 'Guardar cambios' : 'Registrar adelanto'}</button></div></form>`);

function htmlComprobante(c, { numero, borrador, recibido } = {}) {
  const p = c.periodo || {};
  const ing = c.ingresos || [], ded = c.deducciones || [];
  const a = c.asistencia;
  const marcas = a?.marcas || {};

// Exporta un elemento (comprobante) como imagen PNG; en el teléfono abre "Compartir" (WhatsApp, galería…)
async function exportarImagen(el, nombre) {
  if (!window.html2canvas) return toast('Cargando, intenta de nuevo en un momento', true);
  if (!el) return;
  toast('Generando imagen…');
  try {
    await document.fonts?.ready;
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#F7FAFF', useCORS: true, logging: false });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const archivo = new File([blob], `${nombre}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [archivo] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      try { await navigator.share({ files: [archivo], title: nombre }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = archivo.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast('No se pudo generar la imagen: ' + errMsg(e), true); }
}

async function vEmpleados() {
  cargando();
  const [emps, pers] = await Promise.all([
    q(sb.from('pl_empleados').select('*')),
    q(sb.from('pl_periodos').select('id,nombre,fecha_fin').eq('tipo', 'comisiones').eq('estado', 'cerrada').order('fecha_fin', { ascending: false }).limit(3))]);
  // Promedio de comisiones: lo ganado en los últimos 3 meses de comisiones cerrados ÷ número de meses
  const perIds = pers.map(p => p.id);
  const comps = perIds.length ? await q(sb.from('pl_comprobantes').select('empleado_id,neto,datos').in('periodo_id', perIds).eq('anulado', false)) : [];
  // ganado = neto + adelantos/vales/préstamos (ya recibidos); penalizaciones y otras deducciones sí restan
  const sumCom = {}; comps.forEach(c => sumCom[c.empleado_id] = (sumCom[c.empleado_id] || 0) + ganado(c));
  const nMeses = perIds.length || 1;
  const filas = emps.map(e => ({ ...e, prom: Math.round((sumCom[e.id] || 0) / nMeses) }));
  filas.forEach(e => e.total = (+e.salario_mensual || 0) + e.prom);
  let orden = { k: 'nombre', dir: 1 };
  try { orden = JSON.parse(sessionStorage.getItem('pl_emp_orden')) || orden; } catch (_) { }
  const COLS = [
    ['numero', '#', 'num'], ['nombre', 'Nombre', 'txt'], ['cargo', 'Cargo', 'txt'], ['salario_mensual', 'Salario mensual', 'num', 'r'],
    ['prom', 'Prom. comisiones', 'num', 'r'], ['total', 'Total mensual', 'num', 'r'], ['recibe', 'Recibe', 'txt'], ['usuario', 'Usuario', 'txt']];
  const valor = (e, k) => k === 'recibe' ? `${e.recibe_salario ? 'Salario' : ''}${e.recibe_comisiones ? ' Comisiones' : ''}` : k === 'usuario' ? (e.usuario || '') : e[k];
  const act = filas.filter(e => e.activo);
  const tSal = act.reduce((a, e) => a + (+e.salario_mensual || 0), 0), tCom = act.reduce((a, e) => a + e.prom, 0);
  const m = shell(`<div class="top"><div><h1>Empleados</h1><div class="muted small">${act.length} activos · ${pers.length ? `promedio de comisiones de ${pers.length === 1 ? '1 mes' : `${pers.length} meses`}: ${pers.map(p => p.nombre.replace(/^Comisiones /, '')).reverse().join(', ')}` : 'aún no hay meses de comisiones cerrados'}</div></div><div class="acc"><button class="btn pri" id="nuevo">${ICON.mas}Agregar empleado</button></div></div>
    <div class="tscroll"><table class="t" id="temp"><thead><tr>${COLS.map(([k, t, , al]) => `<th class="${al || ''} ordenable" data-k="${k}" aria-sort="none">${t}<span class="flecha"></span></th>`).join('')}</tr></thead><tbody></tbody>
    <tfoot><tr><td></td><td>Total (${act.length} activos)</td><td></td><td class="r">${L(tSal)}</td><td class="r">${L(tCom)}</td><td class="r">${L(tSal + tCom)}</td><td colspan="2" class="small muted" style="font-weight:500">Planilla quincenal: ${L(tSal / 2)}</td></tr></tfoot></table></div>`);
  const pintar = () => {
    const tipo = COLS.find(c => c[0] === orden.k)?.[2];
    const lista = [...filas].sort((a, b) => {
      if (a.activo !== b.activo) return a.activo ? -1 : 1; // inactivos siempre al final
      const x = valor(a, orden.k), y = valor(b, orden.k);
      const r = tipo === 'num' ? (+x || 0) - (+y || 0) : String(x || '').localeCompare(String(y || ''), 'es', { sensitivity: 'base' });
      return r * orden.dir || a.nombre.localeCompare(b.nombre);
    });
    $('#temp tbody', m).innerHTML = lista.map(e => `<tr class="click" data-e="${e.id}" style="${e.activo ? '' : 'opacity:.5'}"><td class="muted">${e.numero}</td><td><b>${esc(e.nombre)}</b>${e.activo ? '' : ' <span class="chip gris">inactivo</span>'}</td><td class="muted">${esc(e.cargo || '')}</td><td class="r">${+e.salario_mensual ? L(e.salario_mensual) : '—'}</td><td class="r">${e.prom ? L(e.prom) : '—'}</td><td class="r num">${e.total ? L(e.total) : '—'}</td><td>${e.recibe_salario ? '<span class="chip">Salario</span> ' : ''}${e.recibe_comisiones ? '<span class="chip warn">Comisiones</span>' : ''}</td><td class="small">${e.user_id ? `<span class="chip ok">${esc(e.usuario || 'vinculado')}</span>` : '<span class="muted">Sin usuario</span>'}</td></tr>`).join('');
    $$('#temp th[data-k]', m).forEach(th => { const on = th.dataset.k === orden.k; th.setAttribute('aria-sort', on ? (orden.dir > 0 ? 'ascending' : 'descending') : 'none'); th.querySelector('.flecha').textContent = on ? (orden.dir > 0 ? ' ▲' : ' ▼') : ''; });
    $$('tr[data-e]', m).forEach(tr => tr.onclick = () => location.hash = `#/empleado/${tr.dataset.e}`);
  };
  $$('#temp th[data-k]', m).forEach(th => th.onclick = () => {
    const k = th.dataset.k; const num = COLS.find(c => c[0] === k)[2] === 'num';
    orden = orden.k === k ? { k, dir: -orden.dir } : { k, dir: num ? -1 : 1 }; // montos: primero de mayor a menor
    try { sessionStorage.setItem('pl_emp_orden', JSON.stringify(orden)); } catch (_) { }
    pintar();
  });
  pintar();
  $('#nuevo', m).onclick = () => editarEmpleado(null);
}

/* ===================== PRÉSTAMOS ===================== */
function itemPrestamo(p, conBoton) {
  const pct = Math.min(100, Math.max(0, (+p.pagado / +p.monto_total) * 100));
  const cuotas = +p.saldo > 0 ? Math.ceil(+p.saldo / +p.cuota) : 0;
  return `<div class="item" ${conBoton ? `data-p="${p.id}"` : ''} style="display:block">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="t">${esc(p.codigo)} ${p.pl_empleados ? '· ' + esc(p.pl_empleados.nombre) : ''}</div><div class="s">Cuota ${L(p.cuota)} por ${p.aplica_en === 'comisiones' ? 'pago de comisiones' : 'quincena'}${cuotas ? ` · faltan ${cuotas} cuota${cuotas > 1 ? 's' : ''}` : ''}</div></div>
      <div style="text-align:right">${+p.saldo <= 0.004 ? '<span class="chip ok">Pagado</span>' : (p.activo ? `<div class="num">${L(p.saldo)}</div><div class="tiny muted">saldo</div>` : '<span class="chip gris">Pausado</span>')}</div></div>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <div class="tiny muted" style="margin-top:4px">Pagado ${L(p.pagado)} de ${L(p.monto_total)}</div></div>`;
}

async function vPrestamos() {
  cargando();
  const [pres0, emps] = await Promise.all([q(sb.from('pl_prestamos_saldo').select('*').order('creado_en')), q(sb.from('pl_empleados').select('id,nombre'))]);
  const pres = pres0.map(p => ({ ...p, pl_empleados: { nombre: emps.find(e => e.id === p.empleado_id)?.nombre || '' } }));
  const act = pres.filter(p => +p.saldo > 0.004);
  const m = shell(`<div class="top"><div><h1>Préstamos a empleados</h1><div class="muted small">${act.length} con saldo · ${L(act.reduce((a, p) => a + +p.saldo, 0))} por recuperar · ${L(act.filter(p => p.activo && p.aplica_en === 'salario').reduce((a, p) => a + Math.min(+p.cuota, +p.saldo), 0))} por quincena</div></div><div class="acc"><button class="btn pri" id="nuevo">${ICON.mas}Nuevo préstamo</button></div></div>
    <div class="segm" style="margin-bottom:12px"><button class="on" data-f="act">Con saldo</button><button data-f="todos">Todos</button></div>
    <div id="lp"></div>`);
  const pintar = f => { const l = f === 'act' ? act : pres; $('#lp', m).innerHTML = l.length ? `<div class="lista">${l.sort((a, b) => a.pl_empleados.nombre.localeCompare(b.pl_empleados.nombre)).map(p => itemPrestamo(p, true)).join('')}</div>` : '<div class="vacio"><b>Sin préstamos</b>Registra el préstamo y su cuota; se descuenta solo en cada planilla.</div>'; $$('[data-p]', m).forEach(b => b.onclick = () => detallePrestamo(pres.find(p => p.id === b.dataset.p))); };
  $$('.segm button', m).forEach(b => b.onclick = () => { $$('.segm button', m).forEach(x => x.classList.toggle('on', x === b)); pintar(b.dataset.f); });
  pintar('act');
  $('#nuevo', m).onclick = () => editarPrestamo(null);
}

async function editarPrestamo(p, empId) {
  const emps = await empleadosActivos();
  p = p || { empleado_id: empId || '', codigo: '', descripcion: '', fecha: iso(hoyHN()), monto_total: '', cuota: '', aplica_en: 'salario', activo: true };
  const h = hoja(p.id ? 'Editar préstamo' : 'Nuevo préstamo', `<form>
    <label class="f">Empleado<select class="inp" name="empleado_id" required><option value="">Elegir…</option>${emps.filter(e => e.activo || e.id === p.empleado_id).map(e => `<option value="${e.id}" ${e.id === p.empleado_id ? 'selected' : ''}>${esc(e.nombre)}</option>`).join('')}</select></label>
    <div class="row2"><label class="f">Código del préstamo<input class="inp" name="codigo" value="${esc(p.codigo)}" required placeholder="NP-000000"></label><label class="f">Fecha<input class="inp" type="date" name="fecha" value="${p.fecha || ''}"></label></div>
    <div class="row2"><label class="f">Deuda total (L)<input class="inp" type="number" step="0.01" min="0.01" name="monto_total" value="${p.monto_total}" required></label><label class="f">Cuota por pago (L)<input class="inp" type="number" step="0.01" min="0.01" name="cuota" value="${p.cuota}" required></label></div>
    <label class="f">Se descuenta en<select class="inp" name="aplica_en"><option value="salario" ${p.aplica_en === 'salario' ? 'selected' : ''}>Planilla de salario (cada quincena)</option><option value="comisiones" ${p.aplica_en === 'comisiones' ? 'selected' : ''}>Pago de comisiones (mensual)</option></select></label>
    <label class="f">Descripción<input class="inp" name="descripcion" value="${esc(p.descripcion || '')}" placeholder="Ej.: préstamo nivelado"></label>
    <label class="chk"><input type="checkbox" name="activo" ${p.activo ? 'checked' : ''}>Descontar en planilla (desmarca para pausar)</label>
    <div class="pie">${p.id ? '<button type="button" class="btn rojo" id="del">Eliminar</button>' : ''}<button class="btn pri">${p.id ? 'Guardar cambios' : 'Registrar préstamo'}</button></div></form>`);
  $('form', h.el).onsubmit = async ev => {
    ev.preventDefault(); const x = formData(ev.target);
    const row = { empleado_id: x.empleado_id, codigo: x.codigo.trim(), fecha: x.fecha || null, monto_total: +x.monto_total, cuota: +x.cuota, aplica_en: x.aplica_en, descripcion: x.descripcion || null, activo: !!x.activo };
    try { if (p.id) await q(sb.from('pl_prestamos').update(row).eq('id', p.id)); else await q(sb.from('pl_prestamos').insert(row)); h.cerrar(); toast(p.id ? 'Cambios guardados' : 'Préstamo registrado'); ruta(); } catch (er) { toast(errMsg(er), true); }
  };
  $('#del', h.el) && ($('#del', h.el).onclick = async () => { h.cerrar(); if (!await confirmar('Eliminar préstamo', 'Se borrará el préstamo y su historial de abonos.', 'Eliminar', true)) return; try { await q(sb.from('pl_prestamos').delete().eq('id', p.id)); toast('Préstamo eliminado'); ruta(); } catch (er) { toast(errMsg(er), true); } });
}

async function detallePrestamo(p) {
  const pagos = await q(sb.from('pl_prestamo_pagos').select('*, pl_periodos(nombre)').eq('prestamo_id', p.id).eq('anulado', false).order('fecha'));
  const h = hoja(`Préstamo ${p.codigo}`, `${itemPrestamo(p, false)}
    <h3 style="margin:16px 0 6px">Abonos</h3>
    ${pagos.length ? `<table class="t"><tbody>${pagos.map(g => `<tr><td>${fc(g.fecha)}</td><td class="muted small">${esc(g.pl_periodos?.nombre || g.nota || 'Abono directo')}</td><td class="r num">${L(g.monto)}</td><td style="width:30px">${g.periodo_id ? '' : `<button class="btn sm rojo" data-del="${g.id}" aria-label="Eliminar abono">×</button>`}</td></tr>`).join('')}</tbody></table>` : '<p class="small muted">Sin abonos todavía. Se registran solos al cerrar cada planilla.</p>'}
    <div class="pie" style="margin-top:14px"><button class="btn" id="abono">Registrar abono directo</button><button class="btn borde" id="edit">Editar préstamo</button></div>`);
  $('#edit', h.el).onclick = () => { h.cerrar(); editarPrestamo(p); };
  $$('[data-del]', h.el).forEach(b => b.onclick = async () => { try { await q(sb.from('pl_prestamo_pagos').delete().eq('id', b.dataset.del)); h.cerrar(); toast('Abono eliminado'); ruta(); } catch (er) { toast(errMsg(er), true); } });
  $('#abono', h.el).onclick = () => {
    h.cerrar();
    const h2 = hoja('Abono directo', `<form><p class="small muted" style="margin:0">Pago hecho fuera de planilla (en caja o depósito).</p><div class="row2"><label class="f">Fecha<input class="inp" type="date" name="fecha" value="${iso(hoyHN())}" required></label><label class="f">Monto (L)<input class="inp" type="number" step="0.01" min="0.01" max="${+p.saldo}" name="monto" required></label></div><label class="f">Nota<input class="inp" name="nota" placeholder="Ej.: pago en caja"></label><div class="pie"><button class="btn pri">Registrar abono</button></div></form>`);
    $('form', h2.el).onsubmit = async ev => { ev.preventDefault(); const x = formData(ev.target); try { await q(sb.from('pl_prestamo_pagos').insert({ prestamo_id: p.id, fecha: x.fecha, monto: +x.monto, nota: x.nota || 'Abono directo' })); h2.cerrar(); toast('Abono registrado'); ruta(); } catch (er) { toast(errMsg(er), true); } };
  };
}

// Lista de pagos con filtro por tipo y rango de fechas (fecha de pago). comps: { periodo, neto, recibido, adel, total_deducciones, recibido_en }
function pagosFiltrables(cont, comps, { link, clave = 'pl_pagos_f' }) {
  const hoy = hoyHN(), y = hoy.getFullYear();
  const PRES = {
    mes: ['Este mes', iso(new Date(y, hoy.getMonth(), 1)), iso(hoy)],
    tres: ['Últimos 3 meses', iso(new Date(y, hoy.getMonth() - 2, 1)), iso(hoy)],
    anio: [`Año ${y}`, `${y}-01-01`, `${y}-12-31`],
    ant: [`Año ${y - 1}`, `${y - 1}-01-01`, `${y - 1}-12-31`],
    todo: ['Todo', '', ''],
  };
  let st = { tipo: '', pre: 'anio', desde: PRES.anio[1], hasta: PRES.anio[2] };
  try { st = { ...st, ...(JSON.parse(sessionStorage.getItem(clave)) || {}) }; } catch (_) { }
  const fp = c => String(c.periodo?.fecha_pago || c.periodo?.fecha_fin || '').slice(0, 10);
  comps = [...comps].sort((x, y) => fp(y).localeCompare(fp(x)));
  cont.innerHTML = `<div class="panel filtros" style="margin-bottom:12px">
      <div class="segm" data-tipo><button type="button" data-f="">Todos</button><button type="button" data-f="salario">Salario</button><button type="button" data-f="comisiones">Comisiones</button></div>
      <select class="inp" data-pre style="width:auto">${Object.entries(PRES).map(([k, [t]]) => `<option value="${k}">${t}</option>`).join('')}<option value="otro">Elegir fechas…</option></select>
      <div class="fechas"><label class="f">Desde<input class="inp" type="date" data-desde></label><label class="f">Hasta<input class="inp" type="date" data-hasta></label></div>
    </div><div data-res></div><div data-lista></div>`;
  const $t = $('[data-tipo]', cont), $p = $('[data-pre]', cont), $d = $('[data-desde]', cont), $h = $('[data-hasta]', cont);
  const pintar = () => {
    try { sessionStorage.setItem(clave, JSON.stringify(st)); } catch (_) { }
    $$('button', $t).forEach(b => b.classList.toggle('on', b.dataset.f === st.tipo));
    $p.value = st.pre; $d.value = st.desde || ''; $h.value = st.hasta || '';
    const l = comps.filter(c => (!st.tipo || c.periodo?.tipo === st.tipo) && (!st.desde || fp(c) >= st.desde) && (!st.hasta || fp(c) <= st.hasta));
    const s = k => l.reduce((a, c) => a + (+c[k] || 0), 0);
    const ganado = s('recibido'), neto = s('neto'), adel = s('adel');
    $('[data-res]', cont).innerHTML = l.length ? `<div class="totales"><div class="neto"><div class="k">Ganado</div><div class="v">${L(ganado)}</div></div>
      <div><div class="k">Depositado en planilla</div><div class="v">${L(neto)}</div></div>
      <div><div class="k">Recibido antes (adelantos, vales, préstamos)</div><div class="v">${L(adel)}</div></div>
      <div><div class="k">Pagos</div><div class="v">${l.length}</div><div class="tiny muted">${l.filter(c => c.periodo?.tipo === 'salario').length} de salario · ${l.filter(c => c.periodo?.tipo === 'comisiones').length} de comisiones</div></div></div>` : '';
    $('[data-lista]', cont).innerHTML = l.length ? `<div class="lista">${l.map(c => `<a class="item" href="${link(c)}"><div class="pago" style="flex:1"><div class="ic ${c.periodo?.tipo === 'comisiones' ? 'c' : 's'}">${c.periodo?.tipo === 'comisiones' ? '%' : 'Q'}</div><div class="grow"><div class="t">${esc(c.periodo?.nombre)}</div><div class="s">${fc(fp(c))} · ${c.adel > 0 ? `ganado ${L(c.recibido)}, menos ${L(c.adel)} en adelantos, vales y préstamos` : `deducciones ${L(c.total_deducciones)}`}</div></div><div style="text-align:right"><div class="num">${L(c.neto)}</div>${c.recibido_en ? '' : '<span class="chip warn" style="margin-top:4px">Por confirmar</span>'}</div></div></a>`).join('')}</div>`
      : '<div class="vacio">No hay pagos en ese rango.</div>';
  };
  $$('button', $t).forEach(b => b.onclick = () => { st.tipo = b.dataset.f; pintar(); });
  $p.onchange = () => { st.pre = $p.value; if (PRES[st.pre]) { st.desde = PRES[st.pre][1]; st.hasta = PRES[st.pre][2]; } pintar(); };
  $d.onchange = () => { st.desde = $d.value; st.pre = 'otro'; pintar(); };
  $h.onchange = () => { st.hasta = $h.value; st.pre = 'otro'; pintar(); };
  pintar();
}
const conGanado = c => { const adel = anticipado(c.datos); return { ...c, periodo: c.datos?.periodo, adel, recibido: +c.neto + adel }; };

const chipEstado = e => ({ pendiente: '<span class="chip warn">Pendiente</span>', aprobado: '<span class="chip ok">Aprobado</span>', aprobada: '<span class="chip ok">Aprobada</span>', rechazado: '<span class="chip red">Rechazado</span>', rechazada: '<span class="chip red">Rechazada</span>', cancelada: '<span class="chip gris">Cancelada</span>', cancelado: '<span class="chip gris">Cancelado</span>' }[e] || esc(e));
async function parametros() { const r = await q(sb.from('pl_parametros').select('*')); const o = {}; r.forEach(x => o[x.clave] = x.valor); return o; }
function mapsLink(lat, lng) { return lat != null ? `<a href="https://maps.google.com/?q=${lat},${lng}" target="_blank" rel="noopener" title="Ver en el mapa" style="display:inline-flex;vertical-align:middle">${ICON.gps.replace('<svg', '<svg width="16" height="16"')}</a>` : '<span class="tiny muted">sin GPS</span>'; }
function obtenerGPS() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Este teléfono no permite ubicación'));
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, prec: p.coords.accuracy }),
      e => rej(new Error(e.code === 1 ? 'Permite el acceso a la ubicación para registrar el odómetro' : 'No se pudo obtener la ubicación. Sal a un lugar abierto e intenta de nuevo')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}
function letras(num) {
  num = Math.round(Number(num) || 0);
  const U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  const C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
  const cien = n => { if (n === 100) return 'cien'; const c = Math.floor(n / 100), r = n % 100; let t = C[c]; if (r) t += (t ? ' ' : '') + (r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' y ' + U[r % 10] : '')); return t; };
  const mil = n => { const m = Math.floor(n / 1000), r = n % 1000; let t = m ? (m === 1 ? 'mil' : cien(m).replace(/uno$/, 'un') + ' mil') : ''; if (r) t += (t ? ' ' : '') + cien(r); return t; };
  if (num === 0) return 'cero';
  const mi = Math.floor(num / 1e6), r = num % 1e6;
  let t = mi ? (mi === 1 ? 'un millón' : mil(mi).replace(/uno$/, 'un') + ' millones') : '';
  if (r) t += (t ? ' ' : '') + mil(r);
  return t.replace(/uno$/, 'un');
}
const lempirasLetras = n => `${letras(n)} lempiras exactos`;

async function vMiCombustible() {
  cargando();
  const hoy = iso(hoyHN());
  const [rows, par] = await Promise.all([q(sb.from('pl_odometro').select('*').eq('empleado_id', S.yo.id).gte('fecha', addDias(hoy, -31)).order('fecha', { ascending: false })), parametros()]);
  const tarifa = +par.tarifa_km || 1.35;
  const ini = rows.find(r => r.fecha === hoy && r.tipo === 'inicio'), fin = rows.find(r => r.fecha === hoy && r.tipo === 'fin');
  const dias = {}; rows.forEach(r => (dias[r.fecha] = dias[r.fecha] || {})[r.tipo] = r);
  const tipo = !ini ? 'inicio' : !fin ? 'fin' : null;
  const m = shell(`<div class="miga"><a href="#/mi-tiempo">Mi tiempo</a></div><div class="top"><div><h1>Odómetro</h1><div class="muted small">${DIAS_LARGO[hoyHN().getDay()]} ${fl(hoy)} · se paga ${L(tarifa).replace('.00', '')} por km</div></div></div>
    ${tipo ? `<div class="panel"><form id="fo" style="display:grid;gap:12px">
        <h3>${tipo === 'inicio' ? 'Inicio del día' : 'Fin del día'}</h3>
        ${tipo === 'fin' ? `<p class="small muted" style="margin:0">Iniciaste con <b>${N(ini.lectura)} km</b> a las ${fdt(ini.registrado_en).split(', ').pop()}</p>` : '<p class="small muted" style="margin:0">Registra el kilometraje de la moto antes de salir. Se guarda la hora y tu ubicación.</p>'}
        <label class="f">Lectura del odómetro (km)<input class="inp" type="number" name="lectura" step="0.1" min="0" required inputmode="decimal" style="font-size:24px;font-family:Poppins;font-weight:700"></label>
        <label class="f">Nota (opcional)<input class="inp" name="nota"></label>
        <div class="small muted" id="gps">${ICON.gps.replace('<svg', '<svg width="14" height="14" style="vertical-align:-2px"')} Se pedirá tu ubicación al guardar.</div>
        <button class="btn pri">${tipo === 'inicio' ? 'Registrar inicio' : 'Registrar fin del día'}</button></form></div>`
    : `<div class="hola"><div class="k">Día completo</div><div class="v">${N(+fin.lectura - +ini.lectura)} km</div><div class="s">${N(ini.lectura)} → ${N(fin.lectura)} · ${L((+fin.lectura - +ini.lectura) * tarifa)}</div></div>`}
    <h2 style="margin:22px 0 10px">Últimos 30 días</h2>
    ${Object.keys(dias).length ? `<div class="tscroll"><table class="t"><thead><tr><th>Fecha</th><th>Inicio</th><th>Fin</th><th class="r">Km</th></tr></thead><tbody>${Object.entries(dias).map(([d, x]) => `<tr><td>${fc(d)}</td><td>${x.inicio ? `${N(x.inicio.lectura)} ${mapsLink(x.inicio.lat, x.inicio.lng)}<div class="tiny muted">${fdt(x.inicio.registrado_en).split(', ').pop()}</div>` : '—'}</td><td>${x.fin ? `${N(x.fin.lectura)} ${mapsLink(x.fin.lat, x.fin.lng)}<div class="tiny muted">${fdt(x.fin.registrado_en).split(', ').pop()}</div>` : '<span class="chip warn">Sin fin</span>'}</td><td class="r num">${x.inicio && x.fin ? N(+x.fin.lectura - +x.inicio.lectura) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="vacio">Sin registros todavía.</div>'}`);
  const f = $('#fo', m);

    e.preventDefault(); const x = formData(f); const b = $('button', f); b.disabled = true;

  };
}

/* ===================== PLANTILLAS DE CÁLCULO ===================== */
const CALCULOS = { porcentaje: 'Porcentaje de un monto', unitario: 'Cantidad × valor por unidad', fijo: 'Monto fijo que se escribe' };
function reglaPlantilla(p) {
  const f = +p.factor !== 100 ? ` × ${N(p.factor)}%` : '';
  return p.calculo === 'porcentaje' ? `${N(p.valor)}% del monto${f}` : p.calculo === 'unitario' ? `L ${N(p.valor)} c/u${f}` : 'monto que se escribe';
}
function calcPlantilla(p, cantidad) {
  const c = +cantidad || 0; const f = (+p.factor || 100) / 100;
  if (p.calculo === 'porcentaje') return { monto: Math.round(c * (+p.valor) / 100 * f), detalle: `L ${N(c)} × ${N(p.valor)}%${+p.factor !== 100 ? ` × ${N(p.factor)}%` : ''}` };
  if (p.calculo === 'unitario') return { monto: Math.round(c * (+p.valor) * f), detalle: `${N(c)} × L ${N(p.valor)}${+p.factor !== 100 ? ` × ${N(p.factor)}%` : ''}` };
  return { monto: Math.round(c), detalle: null };
}
const areaDe = e => String(e.area || e.cargo || '').trim().toLowerCase();
function plantillasDe(e, aplica, todas) {
  const propias = todas.filter(p => p.activo && p.aplica === aplica && p.empleado_id === e.id);
  const deArea = todas.filter(p => p.activo && p.aplica === aplica && !p.empleado_id && p.area && p.area.trim().toLowerCase() === areaDe(e) && !propias.some(x => x.concepto === p.concepto && x.tipo === p.tipo));
  return [...propias, ...deArea].sort((a, b) => (a.tipo === b.tipo ? 0 : a.tipo === 'ingreso' ? -1 : 1) || a.orden - b.orden);
}
async function capturarPlantillas(per) {
  const [todas, emps, movs, calc] = await Promise.all([
    q(sb.from('pl_plantillas').select('*')), q(sb.from('pl_empleados').select('id,nombre,area,cargo,activo,recibe_salario,recibe_comisiones').order('nombre')),
    q(sb.from('pl_movimientos').select('*').eq('periodo_id', per.id)), q(sb.rpc('pl_calcular', { p_periodo: per.id }))]);
  const enPer = new Set(calc.map(c => c.empleado_id));
  const lista = emps.map(e => ({ e, ps: plantillasDe(e, per.tipo, todas) }))
    .filter(({ e, ps }) => ps.length && e.activo && (enPer.has(e.id) || (per.tipo === 'comisiones' ? e.recibe_comisiones : e.recibe_salario)));
  const sinPl = emps.filter(e => enPer.has(e.id) && !lista.some(x => x.e.id === e.id));
  const existente = (e, p) => movs.find(mv => mv.empleado_id === e.id && (mv.plantilla_id === p.id || (mv.concepto === p.concepto && mv.tipo === p.tipo)));
  const h = hoja(`Capturar ${per.tipo === 'comisiones' ? 'comisiones' : 'líneas'} · ${per.nombre}`, `
