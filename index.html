<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<title>VerifiCrédito</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f3f4f1; --card:#ffffff; --ink:#1b1d1c; --ink2:#55605b; --muted:#8a938f; --line:#e2e5e0;
  --brand:#0f5c4d; --brand2:#e7f1ee; --accent:#eb6834;
  --gray:#6b7280; --gray-bg:#eef0f2; --blue:#1d5fb8; --blue-bg:#e3eefc; --green:#17803d; --green-bg:#e2f5e8;
  --red:#b42318; --red-bg:#fde8e6; --amber:#9a6200; --amber-bg:#fdf2d8; --violet:#6a3fb5; --violet-bg:#efe8fb;
  --teal:#0e7c6b; --teal-bg:#ddf3ee; --s1:#2a78d6; --s2:#eb6834;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#121413; --card:#1c1f1e; --ink:#eef1ef; --ink2:#b9c2be; --muted:#87918c; --line:#2d3230;
  --brand:#3fb39a; --brand2:#1d2e2a; --gray-bg:#2a2d2f; --blue-bg:#1b2a40; --green-bg:#17301f; --red-bg:#3a1d1a;
  --amber-bg:#3a2e12; --violet-bg:#2a2140; --teal-bg:#15312c; --gray:#a4abb3; --blue:#7fb0f0; --green:#6fd08f;
  --red:#f28b82; --amber:#f0c060; --violet:#b9a0f0; --teal:#5fd0bb; --s1:#3987e5; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:10px 16px calc(0px);}
header.top .row{display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:650;letter-spacing:.2px}
header.top .who{font-size:12px;opacity:.9;text-align:right}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 10px;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;color:rgba(255,255,255,.78);padding:9px 10px 11px;border-bottom:3px solid transparent;font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs button.on{color:#fff;border-color:#fff}
nav.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:rgba(255,255,255,.22);font-size:11px;line-height:18px;text-align:center}
main{padding:12px 16px 110px;max-width:900px;margin:0 auto}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.sol{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.sol:active{transform:scale(.995)}
.sol .main{flex:1;min-width:0}
.sol .name{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sol .sub{font-size:12.5px;color:var(--ink2);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.sol .right{text-align:right;flex:none}
.sol .amt{font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-gray{color:var(--gray);background:var(--gray-bg)} .c-blue{color:var(--blue);background:var(--blue-bg)}
.c-green{color:var(--green);background:var(--green-bg)} .c-red{color:var(--red);background:var(--red-bg)}
.c-amber{color:var(--amber);background:var(--amber-bg)} .c-violet{color:var(--violet);background:var(--violet-bg)}
.c-teal{color:var(--teal);background:var(--teal-bg)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--gray-bg);color:var(--ink)}
.btn.pri{background:var(--brand);color:#fff}
.btn.ok{background:var(--green);color:#fff} .btn.bad{background:var(--red);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1;min-width:120px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:15;background:var(--accent);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.seg{display:flex;background:var(--gray-bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.filters button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* Modal / hoja */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 12px}
.sheet .bar h2{flex:1;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .body{padding:12px 16px 60px;max-width:760px;margin:0 auto}
.back{background:none;border:0;font-size:22px;padding:2px 8px;color:var(--ink)}
.dlg-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:600px){.dlg-wrap{align-items:center}.dlg{border-radius:18px}}
.dlg h3{margin:0 0 6px}
h4.sec{margin:18px 0 8px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:550;word-break:break-word}
.alert{border-radius:10px;padding:9px 12px;font-size:13.5px;margin:8px 0}
.alert.warn{background:var(--amber-bg);color:var(--amber)} .alert.err{background:var(--red-bg);color:var(--red)}
.alert.info{background:var(--blue-bg);color:var(--blue)} .alert.ok{background:var(--green-bg);color:var(--green)}

/* Ingresos */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 6px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.addrow{display:grid;grid-template-columns:1.2fr 1fr auto auto;gap:6px;margin-top:8px}
@media (max-width:420px){.addrow{grid-template-columns:1fr 1fr}.addrow .seg{grid-column:1/-1}}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.res .box{background:var(--brand2);border-radius:12px;padding:10px 12px}
.res .box .l{font-size:11.5px;color:var(--ink2);font-weight:600}
.res .box .v{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
.res .box.full{grid-column:1/-1}
.x{background:none;border:0;color:var(--muted);font-size:18px;padding:0 6px}

/* Comentarios estilo Facebook */
.cm{display:flex;gap:8px;margin:10px 0}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.av.sm{width:26px;height:26px;font-size:11px}
.cm-b{min-width:0;flex:1}
.bubble{display:inline-block;background:var(--gray-bg);border-radius:16px;padding:7px 12px;max-width:100%}
.bubble .au{font-weight:700;font-size:13.5px}
.bubble .rl{font-size:11px;color:var(--muted);font-weight:600;margin-left:4px}
.bubble .tx{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.cm-meta{font-size:12px;color:var(--ink2);padding:3px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cm-meta button{background:none;border:0;padding:0;font-weight:700;color:var(--ink2);font-size:12px}
.cm-meta button.liked{color:var(--s1)}
.likes{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11.5px}
.replies{margin-left:6px}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.composer textarea{border-radius:18px;padding:9px 14px;resize:none;min-height:40px;max-height:140px;background:var(--gray-bg);border-color:transparent}
.send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:17px}

/* Timeline */
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;margin-bottom:10px;font-size:13.5px}
.tl .ev:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.tl .ev small{color:var(--muted)}

/* Verificación */
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.item.done{border-color:var(--green)}
.item .hd{display:flex;align-items:center;gap:10px;font-weight:650}
.item .hd input{width:22px;height:22px;flex:none}
.thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--card);font-weight:550}
.chk input{width:20px;height:20px;flex:none}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.hbar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar .tr{background:var(--gray-bg);border-radius:4px;height:14px;overflow:hidden}
.hbar .fl{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pipe .st{flex:1;min-width:92px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.pipe .st b{display:block;font-size:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.err{background:var(--red);color:#fff}
.login{max-width:380px;margin:9vh auto;padding:0 16px}
.login .logo{font-size:26px;font-weight:800;color:var(--brand);text-align:center;margin-bottom:4px}
.login p.s{text-align:center;color:var(--ink2);margin-top:0}
.banner{position:sticky;top:52px;z-index:3;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.spacer{flex:1}
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div id="vLogin" class="login hidden">
  <div class="logo">VerifiCrédito</div>
  <p class="s">Gestión de solicitudes de crédito</p>
  <div class="card" id="loginCard">
    <form id="fLogin">
      <label class="f">Correo</label><input id="lEmail" type="email" autocomplete="username" required>
      <label class="f">Contraseña</label><input id="lPass" type="password" autocomplete="current-password" required>
      <div class="btns"><button class="btn pri" type="submit">Entrar</button></div>
    </form>
  </div>
  <div class="card hidden" id="bootCard">
    <div class="alert info">Primera vez: cree la cuenta del administrador.</div>
    <form id="fBoot">
      <label class="f">Nombre</label><input id="bNombre" required>
      <label class="f">Correo</label><input id="bEmail" type="email" required>
      <label class="f">Contraseña (mín. 6)</label><input id="bPass" type="password" minlength="6" required>
      <div class="btns"><button class="btn pri" type="submit">Crear administrador</button></div>
    </form>
  </div>
</div>

<!-- ===== App ===== -->
<div id="vApp" class="hidden">
  <header class="top">
    <div class="row">
      <h1>VerifiCrédito</h1>
      <div class="who"><div id="whoName"></div><div id="whoRol"></div></div>
      <button class="iconbtn" id="btnBell" title="Notificaciones">🔔</button>
      <button class="iconbtn" id="btnOut" title="Salir">⎋</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
  <button class="fab hidden" id="fab">＋ Nueva solicitud</button>
</div>

<div id="sheet" class="sheet hidden">
  <div class="bar"><button class="back" id="sheetBack">←</button><h2 id="sheetTitle"></h2><span id="sheetChip"></span></div>
  <div class="body" id="sheetBody"></div>
</div>

<script>
// ================== Configuración ==================
const SB_URL = 'https://edmvfqelxsxevpmxgbav.supabase.co';
const SB_KEY = 'sb_publishable_lgTmmLtUESDDyX2sff6ArQ_z65Ti9d6';
const TZ = 'America/Tegucigalpa';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// ================== Catálogos ==================
const EST = {
  borrador:{t:'Borrador',c:'gray'}, en_analisis:{t:'En análisis',c:'blue'}, aprobada:{t:'Aprobada',c:'green'},
  denegada:{t:'Denegada',c:'red'}, por_verificar:{t:'Por verificar',c:'amber'},
  desembolso_pendiente:{t:'Desembolso pendiente',c:'violet'}, desembolsada:{t:'Desembolsada',c:'teal'},
  rechazada_verificacion:{t:'Rechazada en verificación',c:'red'}, desistida:{t:'Desistida',c:'gray'}
};
const TIPO = { nuevo:'Nuevo', reingreso:'Reingreso', refinanciamiento:'Refinanciamiento' };
const ROL = { asesor:'Asesor', analista:'Analista', verificador:'Verificador', admin:'Administrador' };
const ITEM = { domicilio:'Visita a domicilio', trabajo:'Visita a trabajo', foto_perfil:'Foto de perfil del cliente',
  referencias:'Referencias familiares', entrega_efectivo:'Entrega de efectivo' };
const ACC = { creada:'Creó la solicitud', enviada_analisis:'Envió a análisis', devuelta_asesor:'Devolvió al asesor',
  dictamen_aprobada:'Aprobó', dictamen_denegada:'Denegó', enviada_verificacion:'Envió a verificación',
  enviada_desembolso:'Envió a desembolso por transferencia', verificacion_ok:'Verificación exitosa',
  verificacion_rechazada:'Rechazó en verificación', desembolsada:'Marcó como desembolsada', desistida:'Cliente desistió',
  regresada_revisadas:'Regresó a revisadas' };
const CERRADAS = ['desembolsada','denegada','rechazada_verificacion','desistida'];

const S = { user:null, me:null, perfiles:{}, params:{}, sols:[], com:{}, tab:null, q:'', filtroTodas:'abiertas',
  det:null, detData:null, replyTo:null, statsRange:'mes', dirty:false };

// ================== Utilidades ==================
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = n => n == null || n === '' || isNaN(n) ? '—' : 'L ' + Number(n).toLocaleString('es-HN', {minimumFractionDigits:0, maximumFractionDigits:2});
const num = v => { const n = parseFloat(String(v ?? '').replace(/[, L]/g,'')); return isNaN(n) ? null : n; };
const fDate = d => d ? new Date(d).toLocaleDateString('es-HN', {timeZone:TZ, day:'2-digit', month:'short', year:'numeric'}) : '—';
const fDT = d => d ? new Date(d).toLocaleString('es-HN', {timeZone:TZ, day:'2-digit', month:'short', hour:'numeric', minute:'2-digit'}) : '—';
const hoyHN = () => new Date().toLocaleDateString('en-CA', {timeZone:TZ});
function hace(d){
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return 'ahora'; if (s < 3600) return `hace ${Math.floor(s/60)} min`;
  if (s < 86400) return `hace ${Math.floor(s/3600)} h`; if (s < 604800) return `hace ${Math.floor(s/86400)} d`;
  return fDate(d);
}
const chip = e => `<span class="chip c-${EST[e]?.c||'gray'}">${esc(EST[e]?.t||e)}</span>`;
const tipoChip = t => `<span class="chip ${t==='nuevo'?'c-blue':t==='reingreso'?'c-teal':'c-violet'}">${TIPO[t]}</span>`;
const nombre = id => S.perfiles[id]?.nombre || '—';
const iniciales = n => (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
const AVC = ['#2a78d6','#eb6834','#1baf7a','#c98500','#d55181','#6a3fb5','#0e7c6b','#b42318'];
const avColor = id => AVC[[...String(id)].reduce((a,c) => a + c.charCodeAt(0), 0) % AVC.length];
const av = (id, sm) => `<div class="av ${sm?'sm':''}" style="background:${avColor(id)}">${esc(iniciales(nombre(id)))}</div>`;
const rol = () => S.me?.rol;
const es = (...r) => r.includes(rol()) || rol() === 'admin';
function edad(fn){ if(!fn) return null; const b = new Date(fn), h = new Date(); let a = h.getFullYear()-b.getFullYear();
  if (h.getMonth()<b.getMonth() || (h.getMonth()===b.getMonth() && h.getDate()<b.getDate())) a--; return a; }
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast' + (err?' err':''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2800); }
function errMsg(e){ return (e?.message || e?.error_description || String(e)).replace(/^.*?ERROR:\s*/,''); }
async function fnUsuarios(body){
  const { data, error } = await sb.functions.invoke('usuarios', { body });
  if (error){ let m = error.message; try { const j = await error.context.json(); if (j?.error) m = j.error; } catch(e){} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
async function run(btn, fn){
  if (btn) btn.disabled = true;
  try { return await fn(); } catch(e){ console.error(e); toast(errMsg(e), true); } finally { if (btn) btn.disabled = false; }
}

// ================== Cálculo (réplica exacta del Excel "Análisis de ingresos") ==================
function calcular(ingresos, tipoPago, rubro){
  const P = S.params;
  const sal = ingresos.filter(i => i.categoria === 'salario').map(i => +i.monto);
  const com = ingresos.filter(i => i.categoria === 'comision').map(i => +i.monto);
  const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : 0;
  const factor = tipoPago === 'Quincenal' ? P.factor_quincenal : tipoPago === 'Semanal' ? P.factor_semanal : 1;
  const r = P.redondeo || 1000;
  const bruto = avg(sal) * factor + avg(com);
  const promedio = Math.sign(bruto) * Math.round(Math.abs(bruto) / r) * r;  // MROUND
  const techo = rubro ? P.techo_rubro_especial : P.techo_regular;
  let limite, motivo;
  if (promedio === 0){ limite = 0; motivo = 'Sin ingresos registrados.'; }
  else if (promedio < P.ingreso_minimo){ limite = null; motivo = 'Ingresos insuficientes.'; }
  else {
    limite = Math.min(techo, Math.floor(promedio * P.porcentaje_limite / 1000) * 1000);  // ROUNDDOWN(-3)
    motivo = promedio * P.porcentaje_limite > techo
      ? (rubro ? 'Política de límite máximo por rubro aplicada.' : 'Política de límite máximo aplicada.')
      : `Aplica límite regular de ${Math.round(P.porcentaje_limite*100)}%.`;
  }
  let aumento = null;
  if (promedio >= P.ingreso_minimo){
    if (rubro) aumento = 'NO ELEGIBLE';
    else { const d = new Date(hoyHN()+'T12:00'); d.setMonth(d.getMonth()+3); aumento = fDate(d); }
  }
  return { promedio, limite, motivo, tasaPref: promedio > P.umbral_tasa_preferencial, aumento,
    insuficiente: promedio > 0 && promedio < P.ingreso_minimo, nSal: sal.length, nCom: com.length, promPago: avg(sal), factor };
}

const dias = (d, n) => d && (Date.now() - new Date(d)) < n*86400000;
const mio = s => s.asesor_id === S.me.id || rol() === 'admin';
function tabsRol(){
  const T = {
    solicitudes:['solicitudes','Solicitudes', s => mio(s) && ['borrador','en_analisis'].includes(s.estado)],
    revisadas:['revisadas','Revisadas', s => mio(s) && (s.estado === 'aprobada' || (s.estado === 'denegada' && dias(s.dictamen_en, 15)))],
    proceso:['proceso','En proceso', s => mio(s) && (['por_verificar','desembolso_pendiente'].includes(s.estado) || (s.estado==='desembolsada' && dias(s.desembolsado_en, 7)))],
    analisis:['analisis','Análisis', s => s.estado === 'en_analisis'],
    verificar:['verificar','Por verificar', s => s.estado === 'por_verificar' && (!s.verificador_id || s.verificador_id === S.me.id || rol()==='admin')],
    verificadas:['verificadas','Mis verificaciones', s => s.verificado_en && s.verificador_id === S.me.id],
    desembolsos:['desembolsos','Desembolsos', s => s.estado === 'desembolso_pendiente' || (s.estado === 'desembolsada' && dias(s.desembolsado_en, 7))],
    todas:['todas','Todas', s => true],
    stats:['stats','Estadísticas'], usuarios:['usuarios','Usuarios'], params:['params','Parámetros']
  };
  const m = { asesor:['solicitudes','revisadas','proceso','todas','stats'],
    analista:['analisis','desembolsos','todas','stats'],
    verificador:['verificar','verificadas','stats'],
    admin:['solicitudes','revisadas','analisis','verificar','desembolsos','todas','stats','usuarios','params'] };
  return m[rol()].map(k => T[k]);
}
function pintarTabs(){
  $('#tabs').innerHTML = tabsRol().map(([k, t, f]) => {
    let n = '';
    if (f && k !== 'todas' && k !== 'verificadas'){
      const c = S.sols.filter(f).filter(s => k !== 'desembolsos' || s.estado === 'desembolso_pendiente').filter(s => k !== 'proceso' || s.estado !== 'desembolsada').length;
      if (c) n = `<span class="n">${c}</span>`;
    }

function pintar(){
  const tab = tabsRol().find(t => t[0] === S.tab);
  if (S.tab === 'stats') return pintarStats();
  if (S.tab === 'usuarios') return pintarUsuarios();
  if (S.tab === 'params') return pintarParams();
  let lista = S.sols.filter(tab[2]);
  let extra = '';
  if (S.tab === 'todas'){
    const fs = [['abiertas','Abiertas'],['todas','Todas'],...Object.entries(EST).map(([k,v]) => [k, v.t])];
    extra = `<div class="filters">${fs.map(([k,t]) => `<button data-f="${k}" class="${S.filtroTodas===k?'on':''}">${t}</button>`).join('')}</div>`;
    if (S.filtroTodas === 'abiertas') lista = lista.filter(s => !CERRADAS.includes(s.estado));
    else if (S.filtroTodas !== 'todas') lista = lista.filter(s => s.estado === S.filtroTodas);
  }
  if (S.tab === 'revisadas'){
    const ap = lista.filter(s => s.estado === 'aprobada').length, dn = lista.length - ap;
    extra = `<div class="alert info small">${ap} aprobada(s) por completar con el cliente · ${dn} denegada(s) en los últimos 15 días</div>`;
  }
  const q = S.q.trim().toLowerCase();
  if (q) lista = lista.filter(s => [s.nombre_cliente, s.codigo, s.dni, s.telefono].some(v => (v||'').toLowerCase().includes(q)));
  // Orden: lo más antiguo esperando primero en colas de trabajo
  if (['analisis','verificar'].includes(S.tab)) lista.sort((a,b) => new Date(a.actualizado_en) - new Date(b.actualizado_en));
  $('#main').innerHTML = `
    <div class="search"><input id="q" placeholder="Buscar por nombre, código, DNI o teléfono" value="${esc(S.q)}"></div>
    ${extra}
    ${lista.length ? lista.map(cardSol).join('') : `<div class="empty">No hay solicitudes aquí.</div>`}`;

// ================== Coincidencias ==================
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function coincidencias(s){
  const n = norm(s.nombre_cliente), tel = (s.telefono||'').replace(/\D/g,''), dni = (s.dni||'').replace(/\D/g,'');
  if (n.length < 5 && !tel && !dni) return '';
  const hits = S.sols.filter(o => o.id !== s.id).map(o => {
    const r = [];
    if (n.length >= 5 && norm(o.nombre_cliente) === n) r.push('mismo nombre');
    if (tel.length >= 8 && (o.telefono||'').replace(/\D/g,'') === tel) r.push('mismo teléfono');
    if (dni.length >= 8 && (o.dni||'').replace(/\D/g,'') === dni) r.push('mismo DNI');
    return r.length ? { o, r } : null;
  }).filter(Boolean);
  if (!hits.length) return '';
  return `<div class="alert warn small"><b>Coincidencias:</b><br>${hits.slice(0,6).map(h =>
    `${esc(h.o.codigo)} · ${esc(h.o.nombre_cliente)} · ${EST[h.o.estado].t} (${h.r.join(', ')})`).join('<br>')}</div>`;
}

        <div class="box"><div class="l">Próximo aumento</div><div class="v" style="font-size:15px">${c.aumento || 'N/A'}</div></div>
        <div class="box full"><div class="l">Techo aplicado</div><div style="font-weight:600">${c.motivo}</div>
          <div class="small muted">Promedio por pago ${L(c.promPago.toFixed(2))} × ${c.factor} ${c.nCom ? '+ promedio comisiones' : ''} → redondeado a ${S.params.redondeo}</div></div>
      </div></div>`;
  }

  // Datos del cliente (completados)
  if (Object.keys(d).length || s.forma_desembolso) h += datosClienteHTML(s);

  // Acciones según estado y rol
  h += accionesHTML(s, c);

  // Verificación
  if (items.length) h += verificacionHTML(s, items);

  // Comentarios
  h += `<div class="card"><h4 class="sec" style="margin-top:0">Comentarios</h4><div id="cmList"><div class="muted small">Cargando…</div></div>
    <div class="composer">${av(S.me.id)}<textarea id="cmTxt" rows="1" placeholder="Escribe un comentario…"></textarea><button class="send" id="cmSend">➤</button></div></div>`;

  // Historial
  h += `<div class="card"><h4 class="sec" style="margin-top:0">Historial</h4><div class="tl">${evs.map(e =>
    `<div class="ev"><b>${esc(nombre(e.usuario_id))}</b> ${esc(ACC[e.accion]||e.accion)}${e.nota ? `: <i>${esc(e.nota)}</i>` : ''}<br><small>${fDT(e.creado_en)}</small></div>`).join('')}</div></div>`;

  $('#sheetTitle').textContent = s.nombre_cliente; $('#sheetChip').innerHTML = chip(s.estado);
  $('#sheetBody').innerHTML = h;
  enlazarDetalle(s, c);
}
function montoLibre(s){
  const base = s.monto_solicitado || s.monto_aprobado;
  if (base == null) return null;
  return +base - (+s.saldo_capital||0) - (+s.saldo_intereses||0);
}
function tablaIng(cat, titulo, ing, edit){
  const rows = ing.filter(i => i.categoria === cat);
  if (!rows.length && !edit) return '';
  return `<label class="f" style="margin-top:14px">${titulo}</label>
    ${rows.length ? `<table class="t"><thead><tr><th>Fecha</th><th class="num">Monto</th><th></th></tr></thead><tbody>
    ${rows.map(i => `<tr><td>${fDate(i.fecha+'T12:00')}</td><td class="num">${L(i.monto)}</td><td style="width:30px">${edit?`<button class="x" data-del="${i.id}" title="Quitar">×</button>`:''}</td></tr>`).join('')}
    </tbody></table>` : `<div class="small muted">Sin registros.</div>`}`;
}

    ${s.desembolso_referencia ? `<div class="alert ok small">Desembolsada ${fDT(s.desembolsado_en)} · ${esc(s.desembolso_referencia)}</div>` : ''}

function accionesHTML(s, c){
  let h = '';
  const abierta = !CERRADAS.includes(s.estado);
  // Asesor: borrador
  if (s.estado === 'borrador' && es('asesor')){
    h += `<div class="card"><div class="small muted">${s.tipo === 'nuevo' ? 'Agregue los pagos de planilla (y comisiones si aplica) y envíe a análisis.' : 'Lista para enviar a análisis.'}</div>
      <div class="btns"><button class="btn pri" id="aEnviar">Enviar a análisis</button></div></div>`;
  }
  // Analista: dictamen
  if (s.estado === 'en_analisis' && es('analista')){
    const refi = s.tipo !== 'nuevo';
    h += `<div class="card"><h4 class="sec" style="margin-top:0">Dictamen</h4>
      ${c.insuficiente ? `<div class="alert err small">Ingresos por debajo del mínimo (${L(S.params.ingreso_minimo)}).</div>` : ''}
      <label class="f">Monto aprobado</label><input id="dMonto" inputmode="decimal" value="${s.tipo==='nuevo' && c.limite ? c.limite : ''}" placeholder="L">
      ${refi ? `<div class="grid2"><div><label class="f">Saldo capital</label><input id="dCap" inputmode="decimal" placeholder="L"></div>
        <div><label class="f">Saldo intereses</label><input id="dInt" inputmode="decimal" placeholder="L"></div></div>
        <div class="alert info small" id="dLibre">Monto libre: —</div>` : ''}
      <label class="f">Nota / motivo</label><textarea id="dNota" rows="2" placeholder="Obligatorio si deniega o devuelve"></textarea>
      <div class="btns"><button class="btn ok" id="dAprobar">Aprobar</button><button class="btn bad" id="dDenegar">Denegar</button></div>
      <div class="btns" style="margin-top:6px"><button class="btn ghost sm" id="dDevolver">↩ Devolver al asesor para corregir</button></div></div>`;
  }
  // Asesor: completar (revisadas)
  if (s.estado === 'aprobada' && es('asesor')) h += completarHTML(s);
  // Desembolso por transferencia
  if (s.estado === 'desembolso_pendiente' && es('analista')){
    const libre = montoLibre(s);
    h += `<div class="card"><h4 class="sec" style="margin-top:0">Desembolso por transferencia</h4>
      <dl class="kv"><dt>Cuenta</dt><dd>${esc(s.cuenta_banco||'—')}</dd>
      <dt>Monto crédito</dt><dd>${L(s.monto_solicitado || s.monto_aprobado)}</dd>
      ${s.tipo !== 'nuevo' ? `<dt>A transferir (libre)</dt><dd><b>${L(libre)}</b></dd>` : ''}</dl>
      <label class="f">Referencia / N.º de transferencia</label><input id="tRef">
      <div class="btns"><button class="btn ok" id="tOk">Marcar como desembolsada</button></div>
      <div class="btns" style="margin-top:6px"><button class="btn ghost sm" id="tBack">↩ Regresar al asesor</button></div></div>`;
  }
  if (s.estado === 'por_verificar' && es('analista') && rol() !== 'verificador'){
    h += `<div class="btns"><button class="btn ghost sm" id="tBack">↩ Regresar a revisadas del asesor</button></div>`;
  }
  if (abierta && es('asesor','analista') && s.estado !== 'desembolso_pendiente')
    h += `<div class="btns"><button class="btn ghost sm" id="aDesistir" style="color:var(--red)">Cliente desistió / cerrar</button></div>`;
  return h;
}

function enlazarDetalle(s, c){
  const B = $('#sheetBody');
  const refrescar = async () => { await cargarSolicitudes(); const n = S.sols.find(x => x.id === s.id); if (n) { S.dirty=false; await abrirDetalle(s.id, true); } pintarTabs(); };

  // Ingresos
  let cat = 'salario';
  B.querySelectorAll('#iCat button').forEach(b => b.onclick = () => { cat = b.dataset.v; B.querySelectorAll('#iCat button').forEach(x => x.classList.toggle('on', x===b)); });
  const add = $('#iAdd');
  if (add){
    const go = () => run(add, async () => {
      const m = num($('#iMonto').value); if (!m || m <= 0) throw new Error('Monto inválido');
      if (!$('#iFecha').value) throw new Error('Fecha requerida');
      const { error } = await sb.from('ingresos').insert({ solicitud_id: s.id, fecha: $('#iFecha').value, monto: m, categoria: cat });
      if (error) throw error;
      await recargarIngresos(); setTimeout(() => $('#iMonto')?.focus(), 50);
    });
    add.onclick = go; $('#iMonto').onkeydown = e => { if (e.key === 'Enter') go(); };
  }
  B.querySelectorAll('[data-del]').forEach(b => b.onclick = () => run(b, async () => {
    const { error } = await sb.from('ingresos').delete().eq('id', +b.dataset.del); if (error) throw error; await recargarIngresos();
  }));
  const updA = () => run(null, async () => {
    await rpc('actualizar_datos_analisis', { p_id: s.id, p_tipo_pago: $('#dPago').value, p_rubro_especial: $('#dRubro').value === '1' });
    s.tipo_pago = $('#dPago').value; s.rubro_especial = $('#dRubro').value === '1'; renderDetalleParcial();
  });
  if ($('#dPago') && !$('#dPago').disabled){ $('#dPago').onchange = updA; $('#dRubro').onchange = updA; }

  // Asesor: enviar
  if ($('#aEnviar')) $('#aEnviar').onclick = e => run(e.target, async () => { await rpc('enviar_analisis', { p_id: s.id }); toast('Enviada a análisis'); await refrescar(); });

  // Analista
  if ($('#dAprobar')){
    const libre = () => { const m = num($('#dMonto').value)||0, k = num($('#dCap')?.value)||0, i = num($('#dInt')?.value)||0;
      if ($('#dLibre')) $('#dLibre').innerHTML = `Monto libre: <b>${L(m - k - i)}</b>${m - k - i < 0 ? ' ⚠ negativo' : ''}`; };
    ['#dMonto','#dCap','#dInt'].forEach(q => { if ($(q)) $(q).oninput = () => { S.dirty = true; libre(); }; }); libre();
    const dict = (btn, tipo) => run(btn, async () => {
      if (tipo === 'aprobada' && c.limite && s.tipo === 'nuevo' && num($('#dMonto').value) > c.limite && !confirm(`El monto supera el límite calculado (${L(c.limite)}). ¿Aprobar de todos modos?`)) return;
      if (tipo === 'aprobada' && c.insuficiente && !confirm('Los ingresos están por debajo del mínimo. ¿Aprobar de todos modos?')) return;
      await rpc('dictaminar', { p_id: s.id, p_dictamen: tipo, p_nota: $('#dNota').value || null, p_monto: num($('#dMonto').value),
        p_saldo_capital: num($('#dCap')?.value), p_saldo_intereses: num($('#dInt')?.value) });
      toast(tipo === 'aprobada' ? 'Aprobada · pasa a revisadas del asesor' : tipo === 'denegada' ? 'Denegada' : 'Devuelta al asesor');
      S.dirty = false; await cerrarDetalle(); await cargarSolicitudes(); pintarTabs(); pintar();
    });
    $('#dAprobar').onclick = e => dict(e.target, 'aprobada');
    $('#dDenegar').onclick = e => dict(e.target, 'denegada');
    $('#dDevolver').onclick = e => dict(e.target, 'devolver');
  }

  // Completar
  if ($('#cForm')) enlazarCompletar(s, refrescar);

  // Desembolso
  if ($('#tOk')) $('#tOk').onclick = e => run(e.target, async () => { await rpc('marcar_desembolsada', { p_id: s.id, p_referencia: $('#tRef').value }); toast('Desembolsada'); await refrescar(); });
  if ($('#tBack')) $('#tBack').onclick = async e => { const n = await pedirTexto('Regresar al asesor', 'Qué debe corregir', 'Regresar'); if (n) run(e.target, async () => { await rpc('regresar_a_revisadas', { p_id: s.id, p_nota: n }); await refrescar(); }); };
  if ($('#aDesistir')) $('#aDesistir').onclick = async e => { const n = await pedirTexto('Cerrar solicitud', 'Motivo (ej. el cliente ya no lo necesita)', 'Cerrar solicitud', 'bad'); if (n) run(e.target, async () => { await rpc('desistir', { p_id: s.id, p_motivo: n }); toast('Solicitud cerrada'); await refrescar(); }); };

  // Verificación
  B.querySelectorAll('.item').forEach(el => {
    const it = el.dataset.item, st = el.querySelector('[data-st]');
    const guardar = (extra = {}) => run(null, async () => {
      await rpc('guardar_item', { p_id: s.id, p_item: it, p_completado: el.querySelector('[data-ck]').checked,
        p_nota: el.querySelector('[data-nota]')?.value || null, p_foto: extra.foto || null, p_lat: extra.lat ?? null, p_lng: extra.lng ?? null });
      if (st) st.textContent = 'Guardado ✓';
      el.classList.toggle('done', el.querySelector('[data-ck]').checked);
      if (extra.foto || extra.lat) { const y = $('#sheet').scrollTop; await abrirDetalle(s.id, true); $('#sheet').scrollTop = y; }
    });
    const ck = el.querySelector('[data-ck]'); if (ck && !ck.disabled) ck.onchange = () => guardar();
    const nt = el.querySelector('[data-nota]'); if (nt) nt.onchange = () => guardar();
    const gps = el.querySelector('[data-gps]');
    if (gps) gps.onclick = () => {
      if (!navigator.geolocation) return toast('GPS no disponible', true);
      st.textContent = 'Obteniendo ubicación…';
      navigator.geolocation.getCurrentPosition(p => guardar({ lat: p.coords.latitude, lng: p.coords.longitude }),
        err => { st.textContent = ''; toast('No se pudo obtener la ubicación: ' + err.message, true); }, { enableHighAccuracy:true, timeout:20000 });
    };
    const foto = el.querySelector('[data-foto]');
    if (foto) foto.onchange = () => run(null, async () => {
      const f = foto.files[0]; if (!f) return;
      st.textContent = 'Subiendo foto…';
      const blob = await comprimir(f);
      const path = `${s.id}/${it}-${Date.now()}.jpg`;
      const { error } = await sb.storage.from('evidencias').upload(path, blob, { contentType:'image/jpeg' });
      if (error) throw error;
      await guardar({ foto: path });
    });
  });
  B.querySelectorAll('img[data-path]').forEach(async img => {
    const { data } = await sb.storage.from('evidencias').createSignedUrl(img.dataset.path, 3600);
    if (data?.signedUrl){ img.src = data.signedUrl; img.onclick = () => window.open(data.signedUrl, '_blank'); }
  });
  if ($('#vOk')) $('#vOk').onclick = e => run(e.target, async () => {
    const r = await rpc('finalizar_verificacion', { p_id: s.id, p_resultado: 'ok', p_nota: $('#vNota').value || null });
    toast(r === 'desembolsada' ? 'Verificada y desembolsada en efectivo' : 'Verificada · pasa a desembolso por transferencia'); await refrescar();
  });
  if ($('#vBad')) $('#vBad').onclick = e => run(e.target, async () => {

function comprimir(file, max = 1280, q = 0.75){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => b ? res(b) : rej(new Error('No se pudo procesar la foto')), 'image/jpeg', q);
      URL.revokeObjectURL(img.src);
    }; img.onerror = () => rej(new Error('Imagen inválida')); img.src = URL.createObjectURL(file);
  });
}

function enlazarCompletar(s, refrescar){
  const F = $('#cForm'); const nuevo = s.tipo === 'nuevo';
  let forma = s.forma_desembolso || null;
  const destino = () => {
    const act = !nuevo && ($('#cDom').checked || $('#cTrab').checked || $('#cFoto').checked);
    const directo = !nuevo && forma === 'transferencia' && !act;
    $('#cVerF').classList.toggle('hidden', directo);
    $('#cDestino').innerHTML = !forma ? 'Seleccione la forma de desembolso.'
      : directo ? '➡ Pasará directo a <b>Desembolsos por transferencia</b> (no requiere verificador).'
      : `➡ Pasará a <b>Verificación</b>${forma === 'efectivo' ? ' (el verificador entrega el efectivo)' : ''}.`;
  };
  F.querySelectorAll('input,textarea,select').forEach(i => i.addEventListener('input', () => S.dirty = true));
  F.querySelectorAll('#cForma button').forEach(b => b.onclick = () => { forma = b.dataset.v; S.dirty = true;
    F.querySelectorAll('#cForma button').forEach(x => x.classList.toggle('on', x===b)); $('#cCtaF').classList.toggle('hidden', forma !== 'transferencia'); destino(); });
  if (!nuevo){
    $('#cDom').onchange = () => { $('#cDomF').classList.toggle('hidden', !$('#cDom').checked); destino(); };
    $('#cTrab').onchange = () => { $('#cTrabF').classList.toggle('hidden', !$('#cTrab').checked); destino(); };
    $('#cFoto').onchange = destino;
  } else {
    const fn = F.querySelector('[data-k="fecha_nacimiento"]');
    const chkEdad = () => { const e = edad(fn.value); $('#cEdad').innerHTML = e != null && e < S.params.edad_minima ? `<div class="alert err small">⚠ El cliente tiene ${e} años. Mínimo ${S.params.edad_minima}: la solicitud no califica.</div>` : ''; };
    fn.onchange = chkEdad; chkEdad();
  }
  destino();
  $('#cEnviar').onclick = e => run(e.target, async () => {
    const datos = { ...(s.datos_cliente || {}) };
    F.querySelectorAll('[data-k]').forEach(i => { if (!i.closest('.hidden')) datos[i.dataset.k] = i.value.trim(); });
    if (nuevo) datos.referencias = [...F.querySelectorAll('[data-ref]')].map(r => Object.fromEntries([...r.querySelectorAll('[data-r]')].map(i => [i.dataset.r, i.value.trim()])));
    if (!forma) throw new Error('Seleccione la forma de desembolso');
    if (nuevo){
      const e2 = edad(datos.fecha_nacimiento);
      if (!datos.fecha_nacimiento) throw new Error('Ingrese la fecha de nacimiento');
      if (e2 < S.params.edad_minima) throw new Error(`El cliente tiene ${e2} años (mínimo ${S.params.edad_minima})`);
      if (datos.referencias.filter(r => r.nombre && r.telefono).length < 2) throw new Error('Ingrese 2 referencias familiares con teléfono');
    }
    const r = await rpc('completar_solicitud', { p_id: s.id, p_datos: datos, p_forma: forma,
      p_act_domicilio: !nuevo && $('#cDom').checked, p_act_trabajo: !nuevo && $('#cTrab').checked, p_act_foto: !nuevo && $('#cFoto').checked,
      p_verificador: $('#cVer').value || null, p_monto_solicitado: num($('#cMonto').value), p_plazo: num($('#cPlazo').value), p_cuenta: $('#cCta').value || null });
    S.dirty = false;

function rango(k){
  const h = hoyHN(), d = new Date(h + 'T12:00');
  const iso = x => x.toLocaleDateString('en-CA');
  if (k === 'hoy') return [h, h];
  if (k === '7d'){ const a = new Date(d); a.setDate(a.getDate()-6); return [iso(a), h]; }
  if (k === '30d'){ const a = new Date(d); a.setDate(a.getDate()-29); return [iso(a), h]; }
  if (k === 'mes') return [h.slice(0,8) + '01', h];
  if (k === 'mesant'){ const a = new Date(d.getFullYear(), d.getMonth()-1, 1, 12), b = new Date(d.getFullYear(), d.getMonth(), 0, 12); return [iso(a), iso(b)]; }
}

function barras(rows){
  const max = Math.max(1, ...rows.map(r => r[1]));
  return rows.map(([l, v, t]) => `<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l)}">${esc(l)}</span><div class="tr"><div class="fl" style="width:${v/max*100}%"></div></div><b>${esc(t)}</b></div>`).join('');
}
function graficoDias(el, data){
  if (!data.length) return el.innerHTML = '<div class="muted small">Sin datos</div>';
  const W = 640, H = 200, pl = 28, pb = 22, pt = 8, n = data.length;
  const max = Math.max(1, ...data.flatMap(d => [d.creadas, d.desembolsadas]));
  const step = (W - pl) / n, bw = Math.max(2, Math.min(14, step / 2 - 3));
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [...new Set([0, Math.round(max/2), max])];
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Solicitudes creadas y desembolsadas por día">`;
  ticks.forEach(t => svg += `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${t}</text>`);
  const r = (x, v, c) => { if (!v) return ''; const top = y(v), h = y(0) - top; const rr = Math.min(4, h, bw/2);
    return `<path d="M${x},${y(0)} v${-(h-rr)} q0,${-rr} ${rr},${-rr} h${bw-2*rr} q${rr},0 ${rr},${rr} v${h-rr} z" fill="${c}"/>`; };
  const every = Math.ceil(n / 8);
  data.forEach((d, i) => {
    const cx = pl + step * i + step / 2;
    svg += r(cx - bw - 1, d.creadas, 'var(--s1)') + r(cx + 1, d.desembolsadas, 'var(--s2)');
    if (i % every === 0) svg += `<text x="${cx}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${d.dia.slice(8)}/${d.dia.slice(5,7)}</text>`;
    svg += `<rect data-i="${i}" x="${pl + step*i}" y="0" width="${step}" height="${H-pb}" fill="transparent"/>`;
  });
  svg += `<line x1="${pl}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/></svg><div class="tip hidden"></div>`;
  el.innerHTML = svg;
  const tip = el.querySelector('.tip');
  el.querySelectorAll('rect[data-i]').forEach(rc => {
    const show = () => { const d = data[+rc.dataset.i]; const b = rc.getBoundingClientRect(), p = el.getBoundingClientRect();
      tip.innerHTML = `<b>${fDate(d.dia+'T12:00')}</b><br>Creadas: ${d.creadas}<br>Desembolsadas: ${d.desembolsadas}`;
      tip.style.left = Math.min(Math.max(b.left - p.left + b.width/2, 60), p.width - 60) + 'px'; tip.style.top = '40px'; tip.classList.remove('hidden'); };
    rc.addEventListener('mouseenter', show); rc.addEventListener('click', show);
    rc.addEventListener('mouseleave', () => tip.classList.add('hidden'));
  });
}

let tRe = null, canal = null;
function suscribir(){
  if (canal) sb.removeChannel(canal);
  canal = sb.channel('vc')
    .on('postgres_changes', { event:'*', schema:'public', table:'solicitudes' }, p => { avisar(p); programarRecarga(p); })
    .on('postgres_changes', { event:'*', schema:'public', table:'comentarios' }, p => {
      const sid = p.new?.solicitud_id || p.old?.solicitud_id;
      if (S.det && (!sid || sid === S.det)) cargarComentarios();
      if (p.eventType === 'INSERT' && p.new.autor_id !== S.me.id && p.new.solicitud_id !== S.det){
        const s = S.sols.find(x => x.id === p.new.solicitud_id);
        if (s) notificar(`💬 ${nombre(p.new.autor_id)} comentó en ${s.nombre_cliente}`, p.new.texto.slice(0,80), s.id);
      }
      programarRecarga();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'comentario_likes' }, () => { if (S.det) cargarComentarios(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'ingresos' }, p => {
      const sid = p.new?.solicitud_id || p.old?.solicitud_id;
      if (S.det && sid === S.det && !S.dirty) recargarIngresos();
    })
    .subscribe(st => { if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setTimeout(suscribir, 5000); });
}
function programarRecarga(p){
  clearTimeout(tRe);
  tRe = setTimeout(async () => {
    const antes = S.det ? S.sols.find(x => x.id === S.det) : null;
    await cargarSolicitudes(); pintarTabs();
    if ($('#sheet').classList.contains('hidden')) pintar();
    else if (antes){
      const ahora = S.sols.find(x => x.id === S.det);
      if (ahora && ahora.estado !== antes.estado){
        if (S.dirty){ toast(`Esta solicitud cambió a "${EST[ahora.estado].t}". Cierre y vuelva a abrir para ver los cambios.`); }
        else abrirDetalle(S.det, true);
      }
    }
  }, 600);
}
function avisar(p){
  if (p.eventType !== 'UPDATE' && p.eventType !== 'INSERT') return;
  const s = p.new, prev = S.sols.find(x => x.id === s.id);
  if (prev && prev.estado === s.estado) return;
  const n = s.nombre_cliente;
  if (s.estado === 'en_analisis' && es('analista')) notificar('Nueva solicitud en análisis', `${n} · ${TIPO[s.tipo]}`, s.id);
  else if (['aprobada','denegada'].includes(s.estado) && s.asesor_id === S.me.id) notificar(`Solicitud ${EST[s.estado].t.toLowerCase()}`, n, s.id);
  else if (s.estado === 'borrador' && prev?.estado === 'en_analisis' && s.asesor_id === S.me.id) notificar('Solicitud devuelta para corregir', n, s.id);
  else if (s.estado === 'por_verificar' && rol() === 'verificador' && (!s.verificador_id || s.verificador_id === S.me.id)) notificar('Nueva verificación asignada', n, s.id);
  else if (s.estado === 'desembolso_pendiente' && es('analista')) notificar('Desembolso por transferencia pendiente', n, s.id);
}
function notificar(t, b, id){
  toast(`${t}: ${b}`);
  try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden){
    const nt = new Notification(t, { body: b, tag: 'vc-' + id }); nt.onclick = () => { window.focus(); abrirDetalle(id); };
  } } catch(e){}
}
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && S.me){ await cargarSolicitudes(); pintarTabs(); if ($('#sheet').classList.contains('hidden')) pintar(); }
});
setInterval(async () => { if (S.me && !document.hidden && $('#sheet').classList.contains('hidden')){ await cargarSolicitudes(); pintarTabs(); if (!document.activeElement || document.activeElement.id !== 'q') pintar(); } }, 60000);

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
init();
</script>
